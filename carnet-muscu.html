<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carnet de muscu</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E8EBEC; --surface:#F6F7F7; --fg:#11161A; --muted:#58646B; --rule:#CBD1D4;
  --accent:#1D4ED8; --accent-fg:#FFFFFF; --pr:#E9B400; --pr-fg:#2B2100; --danger:#B3261E;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1315; --surface:#181E21; --fg:#E9EEF0; --muted:#93A0A7; --rule:#2A3338;
    --accent:#7C97FF; --accent-fg:#0B1020; --pr:#F2C230; --pr-fg:#2B2100; --danger:#FF8A80;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:15px; line-height:1.45;
  padding-block:20px 104px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:640px; margin:0 auto}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
[hidden]{display:none!important}
.head{display:flex; flex-direction:column; gap:6px; margin-bottom:18px}
.eyebrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.eyebrow input[type=date]{background:transparent; border:1px solid var(--rule); border-radius:6px; padding:4px 8px; min-height:32px; font-size:13px}

h2{font-family:var(--display); font-weight:700; font-size:26px; line-height:1.05; margin:0; overflow-wrap:anywhere}
.ex{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:14px; margin-bottom:12px}
.ex-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
.hint{margin:4px 0 12px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.sethead,.set{display:grid; grid-template-columns:26px minmax(0,1fr) 12px minmax(0,1fr) 64px 36px; gap:8px; align-items:center}
.sethead{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.set{margin-bottom:6px}
.idx{font-family:var(--display); font-weight:700; font-size:20px; color:var(--muted); text-align:center; line-height:28px; height:28px}
.set input{width:100%; min-width:0; height:46px; background:var(--bg); border:1px solid var(--rule); border-radius:6px; padding:0 10px; font-family:var(--display); font-weight:700; font-size:26px; font-variant-numeric:tabular-nums}
.times{text-align:center; color:var(--muted)}
.idx.pr{background:var(--pr); color:var(--pr-fg); border-radius:6px}
.set input.rir{font-family:var(--body); font-weight:500; font-size:15px; text-align:center; padding:0 4px}

.btn{min-height:44px; padding:0 16px; border-radius:8px; border:1px solid var(--rule); background:var(--surface); font-weight:600}

.link{background:none; border:0; color:var(--muted); min-height:44px; padding:0 4px; font-size:13px; text-decoration:underline}
.link.danger{color:var(--danger)}
.add{margin:18px 0}
.add-row{display:flex; gap:8px}
.add-row input{flex:1; min-width:0; height:46px; border:1px solid var(--rule); border-radius:8px; background:var(--surface); padding:0 12px}
.lbl{display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.chip{min-height:38px; padding:0 12px; border-radius:999px; border:1px solid var(--rule); background:transparent; font-size:14px}
.chip:hover{border-color:var(--accent); color:var(--accent)}
textarea{width:100%; border:1px solid var(--rule); border-radius:8px; background:var(--surface); padding:10px 12px; resize:vertical}
.foot-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; justify-content:space-between}
.empty{border:1px dashed var(--rule); border-radius:10px; padding:18px; color:var(--muted)}
.empty strong{display:block; color:var(--fg); font-family:var(--display); font-size:24px; font-weight:700; margin-bottom:4px}
.hist{display:grid; grid-template-columns:64px minmax(0,1fr); gap:12px; width:100%; text-align:left; background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:12px; margin-bottom:8px}
.hist:hover{border-color:var(--accent)}
.hd{font-family:var(--display); font-weight:800; font-size:36px; line-height:.9; text-align:center}
.hd small{display:block; font-family:var(--body); font-weight:400; font-size:12px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin-top:4px}
.hn{font-weight:600; overflow-wrap:anywhere}
.hm{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:14px}
.stat{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:10px 12px}
.stat b{display:block; font-family:var(--display); font-size:30px; line-height:1; font-weight:800; font-variant-numeric:tabular-nums}
.stat span{font-size:12px; color:var(--muted)}
select{width:100%; height:46px; border:1px solid var(--rule); border-radius:8px; background:var(--surface); padding:0 10px; margin-bottom:12px}
.chart{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:10px; margin-bottom:12px}
.chart svg{display:block; width:100%; height:auto}
.chart text{fill:var(--muted); font-family:var(--body); font-size:11px; font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--rule); stroke-width:1}
.chart .line{fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round}
.chart .pt{fill:var(--surface); stroke:var(--accent); stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart text.val{fill:var(--fg); font-weight:600; font-size:12px}
.plist{list-style:none; margin:0; padding:0}
.plist li{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--rule); font-variant-numeric:tabular-nums}
.plist li span:last-child{color:var(--muted); text-align:right; min-width:0; overflow-wrap:anywhere}
nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--rule); z-index:20; padding-bottom:env(safe-area-inset-bottom, 0px); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
nav .in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr)}
nav button{background:none; border:0; border-top:3px solid transparent; min-height:56px; font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.03em; text-transform:uppercase; color:var(--muted)}
nav button[aria-current="page"]{color:var(--fg); border-top-color:var(--accent)}
.statc{display:flex; align-items:center; height:46px; padding:0 10px; font-family:var(--display); font-weight:700; font-size:20px; color:var(--muted); border:1px dashed var(--rule); border-radius:6px; white-space:nowrap; overflow:hidden}
.sname{width:100%; height:40px; border:0; border-bottom:1px solid var(--rule); background:transparent; padding:0; border-radius:0}
.imp{margin-top:22px; padding:14px; border:1px solid var(--rule); border-radius:10px; background:var(--surface)}
.imp h2{font-size:24px; margin-bottom:6px}
.imp input[type=file]{width:100%; margin:4px 0 2px}
.imp .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.imp .stats{margin:10px 0}
.ana{margin-top:16px; padding:14px; border:1px solid var(--rule); border-radius:10px; background:var(--surface)}
.ana h2{font-size:22px; margin-bottom:6px}
.anatxt{white-space:pre-wrap; margin:0 0 8px; min-height:1.4em}
.wkbar{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.wkbar .btn{min-width:48px; padding:0}
.wklab{flex:1; text-align:center; font-family:var(--display); font-weight:700; font-size:24px}
.btn:disabled{opacity:.4; cursor:default}
.glist,.notes-l{list-style:none; margin:0 0 14px; padding:0}
.glist li,.notes-l li{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--rule); font-variant-numeric:tabular-nums}
.glist .v{text-align:right}
.delta{color:var(--muted)}
.notes-l li{display:block; font-size:14px; overflow-wrap:anywhere}
.notes-l time{color:var(--muted); margin-right:8px}
.sect{font-family:var(--display); font-weight:700; font-size:22px; margin:18px 0 6px}
.chat{display:flex; flex-direction:column; gap:12px; margin-bottom:14px}
.msg{max-width:88%; padding:10px 12px; border-radius:12px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px}
.msg.user{align-self:flex-end; background:var(--accent); color:var(--accent-fg); border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start; background:var(--surface); border:1px solid var(--rule); border-bottom-left-radius:4px}
.msg.bot .msgtime{display:block; font-size:11px; color:var(--muted); margin-top:4px}
.msg.user .msgtime{display:block; font-size:11px; color:var(--accent-fg); opacity:.7; margin-top:4px; text-align:right}
.chatbar{position:sticky; bottom:0; background:var(--bg); padding-top:8px; margin-top:8px}
.chatbar textarea{width:100%; min-height:52px; max-height:140px; resize:vertical; padding:10px 12px; border:1px solid var(--rule); border-radius:10px; background:var(--surface)}
.chatbar .row{display:flex; gap:8px; margin-top:8px; justify-content:flex-end}
.chips.sugg{margin-bottom:10px}
.chips.sugg .chip{font-size:13px; min-height:34px; padding:0 10px}
.chat-empty{border:1px dashed var(--rule); border-radius:10px; padding:16px; color:var(--muted); margin-bottom:12px}
.chat-empty strong{display:block; color:var(--fg); font-family:var(--display); font-size:22px; margin-bottom:4px}
</style>

<div class="wrap">
  <main>
    <section id="v-seance" aria-label="Séance"></section>
    <section id="v-histo" aria-label="Historique" hidden></section>
    <section id="v-prog" aria-label="Progression" hidden></section>
    <section id="v-bilan" aria-label="Bilan de la semaine" hidden></section>
    <section id="v-coach" aria-label="Coach" hidden></section>
  </main>
</div>
<nav aria-label="Navigation">
  <div class="in">
    <button type="button" data-act="tab" data-tab="seance">Séance</button>
    <button type="button" data-act="tab" data-tab="histo">Historique</button>
    <button type="button" data-act="tab" data-tab="prog">Progrès</button>
    <button type="button" data-act="tab" data-tab="bilan">Bilan</button>
    <button type="button" data-act="tab" data-tab="coach">Coach</button>
  </div>
</nav>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var DEFAULTS=['Développé couché','Squat','Soulevé de terre','Développé militaire','Tractions','Rowing barre','Presse à cuisses','Dips','Curl biceps','Hip thrust','Fentes','Tirage vertical'];
  var LS_KEY='carnet-muscu.v1';
  var state={tab:'seance',sessions:[],cur:null,loaded:false,saveState:'idle',confirm:null,chartEx:null,histoN:40,imp:null,importing:false,ana:{sid:null,busy:false,error:null,live:null},wkStart:Number(lsGet('carnet-muscu.wkstart','1')),wkMode:lsGet('carnet-muscu.wkmode','cycle'),cycTitle:lsGet('carnet-muscu.cyctitle',''),wkOff:0,weeks:{},wana:{ws:null,busy:false,error:null,live:null},coach:{busy:false,error:null,live:null}};
  var rTimer=null,saveTimer=null,chain=Promise.resolve(),dirty=false,confirmTimer=null;
  var anaAbort=null,wkAbort=null,coachAbort=null;
  var _gmapCache=null,_nameListCache=null;

  function invalidateCaches(){_gmapCache=null;_nameListCache=null;}
  function normKey(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}

  function uid8(){return Math.random().toString(36).slice(2,10)}
  function pad(n){return String(n).padStart(2,'0')}
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function parseDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
  function fmtLong(s){return parseDate(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
  function fmtShort(s){return parseDate(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
  function num(n,d){return Number(n).toLocaleString('fr-FR',{maximumFractionDigits:d==null?1:d})}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function byDateDesc(a,b){return b.date.localeCompare(a.date)||(b.updatedAt||0)-(a.updatedAt||0)}
  function newSession(){return {id:uid8(),date:todayStr(),exercises:[],note:'',updatedAt:0}}
  function fmtDur(t){return t%60===0?(t/60)+' min':t>=60?Math.floor(t/60)+' min '+(t%60)+' s':t+' s'}
  function fmtSet(s){
    if(s.t||s.km){var p=[];if(s.t)p.push(fmtDur(s.t));if(s.km)p.push(num(s.km,2)+' km');if(s.kg>0)p.push('+'+num(s.kg)+' kg');return p.join(' · ')}
    return s.kg>0?(s.reps||0)+'×'+num(s.kg):(s.reps||0)+' reps';
  }
  function fmtSetN(s){return fmtSet(s)+(s.n?' ['+s.n+']':'')}
  function cp(s){var o={reps:s.reps,kg:s.kg};if(s.t)o.t=s.t;if(s.km)o.km=s.km;return o}
  function e1rm(s){return s.kg>0&&s.reps>0?(s.reps===1?s.kg:s.kg*(1+s.reps/30)):0}
  function sessVol(s){var v=0;(s.exercises||[]).forEach(function(e){e.sets.forEach(function(x){v+=(x.reps||0)*(x.kg||0)})});return v}
  function setCount(s){var n=0;(s.exercises||[]).forEach(function(e){n+=e.sets.length});return n}

  function allSessions(){
    var m=new Map();state.sessions.forEach(function(s){m.set(s.id,s)});
    if(state.cur&&state.cur.exercises.length)m.set(state.cur.id,state.cur);
    return Array.from(m.values()).filter(function(s){return (s.exercises||[]).length}).sort(byDateDesc);
  }
  function history(name,excludeId){
    var key=normKey(name),out=[];
    allSessions().forEach(function(s){
      if(s.id===excludeId)return;
      var ex=s.exercises.find(function(e){return normKey(e.name)===key});
      if(ex&&ex.sets.length)out.push({s:s,ex:ex});
    });
    return out;
  }
  function nameList(){
    if(_nameListCache)return _nameListCache;
    var count=new Map(),first=new Map();
    allSessions().forEach(function(s){s.exercises.forEach(function(e){var k=normKey(e.name);count.set(k,(count.get(k)||0)+1);if(!first.has(k))first.set(k,e.name)})});
    var used=Array.from(count.keys()).sort(function(a,b){return count.get(b)-count.get(a)}).map(function(k){return first.get(k)});
    DEFAULTS.forEach(function(n){if(!count.has(normKey(n)))used.push(n)});
    return _nameListCache=used;
  }
  function defaultSet(name,ex){
    if(ex&&ex.sets.length){var l=ex.sets[ex.sets.length-1];return cp(l)}
    var h=history(name,state.cur.id)[0];
    if(h){var i=(ex?ex.sets.length:0),src=h.ex.sets[Math.min(i,h.ex.sets.length-1)];return cp(src)}
    return {reps:null,kg:null};
  }
  function isPR(name,set){
    if(!(set.reps>0))return false;
    var h=history(name,state.cur.id);if(!h.length)return false;
    var bw=!(set.kg>0),best=0;
    h.forEach(function(x){x.ex.sets.forEach(function(s){
      if(!(s.reps>0))return;
      if(bw){if(!(s.kg>0))best=Math.max(best,s.reps)}else if(s.kg>0)best=Math.max(best,e1rm(s));
    })});
    if(!best)return false;
    return bw?set.reps>best:e1rm(set)>best+0.05;
  }

  function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
  var GN={'Extenseurs des bras':'Triceps','Fléchisseurs des bras':'Biceps','Muscles dorsaux':'Dos','Muscles lombaires':'Lombaires','Extenseurs des poignets':'Avant-bras','Fléchisseurs des poignets':'Avant-bras'};
  function normG(s){
    var out=[];
    String(s||'').replace(/ /g,' ').split(',').forEach(function(x){x=x.trim();if(!x)return;x=GN[x]||x;if(out.indexOf(x)<0)out.push(x)});
    return out;
  }
  var HEUR=[
    [/leg curl|ischio|roumain|soulev[ée] de terre|good.?morning/i,'Ischio-jambiers'],
    [/hip thrust|fessier/i,'Fessiers'],
    [/squat|presse|fentes|leg ext|hack|extension des jambes/i,'Quadriceps'],
    [/mollet/i,'Mollets'],
    [/abdo|crunch|gainage|relev[ée] de jambes|relev[ée] du buste/i,'Abdominaux'],
    [/curl|biceps/i,'Biceps'],
    [/triceps|jm press|barre au front|dips|kickback|extension/i,'Triceps'],
    [/[ée]l[ée]vation lat|militaire|d[ée]velopp[ée] (devant|avec halt[eè]res, assis|[ée]paules)|oiseau|tirage au visage|face pull/i,'Épaules'],
    [/d[ée]velopp[ée]|[ée]cart[ée]|pec|pompes/i,'Pectoraux'],
    [/traction|tirage|rowing|row|pull|dorsal/i,'Dos']
  ];

  /* ---------- Stockage local ---------- */
  function localLoad(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]')}catch(e){return []}}
  function localSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(state.sessions))}catch(e){}}

  async function getSample(){
    return async function(prompt, options){
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error(err || ('Erreur API ' + res.status));
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
            if (delta) {
              fullText += delta;
              if (options && options.onText) options.onText({ text: fullText });
            }
          } catch (e) {}
        }
      }
      return { text: fullText };
    };
  }

  function initStore(){
    state.sessions=localLoad();
    try{state.weeks=JSON.parse(lsGet('carnet-muscu.weeks','{}'))}catch(e){state.weeks={}}
    onSessions();
  }

  function onSessions(){
    invalidateCaches();
    if(!state.loaded){
      state.loaded=true;
      if(!dirty&&!state.cur.exercises.length){
        var t=state.sessions.filter(function(s){return s.date===todayStr()&&s.exercises.length}).sort(byDateDesc)[0];
        if(t)state.cur=clone(t);
      }
      renderAll();
      return;
    }
    if(state.importing)return;
    clearTimeout(rTimer);
    rTimer=setTimeout(function(){
      if(state.tab==='histo')renderHisto();else if(state.tab==='prog')renderProg();else if(state.tab==='bilan')renderBilan();else if(state.tab==='coach')renderCoach();else{updateStatus();renderProgs()}
    },250);
  }

  function markDirty(){
    state.cur.updatedAt=Date.now();dirty=true;state.saveState='saving';updateStatus();
    clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
  }
  function flush(){
    chain=chain.then(doSave).catch(function(){state.saveState='error';updateStatus();});
  }
  async function doSaveSnapshot(s){
    var empty=!s.exercises.length&&!s.note.trim();
    try{

  /* ---------- Import GymBook ---------- */
  function csvParse(txt){
    var rows=[],row=[],f='',q=false,i=0,n=txt.length;
    if(txt.charCodeAt(0)===0xFEFF)i=1;
    for(;i<n;i++){
      var ch=txt[i];
      if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
      else if(ch==='"')q=true;
      else if(ch===','){row.push(f);f=''}
      else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
      else f+=ch;
    }
    if(f!==''||row.length){row.push(f);rows.push(row)}
    return rows;
  }
  function pnum(s){var m=String(s||'').replace(/[\s  ]/g,'').match(/-?\d+(?:[.,]\d+)?/);return m?Number(m[0].replace(',','.')):null}
  function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)}
  function buildImport(rows){
    var h=(rows[0]||[]).map(function(x){return String(x).trim().normalize('NFC')});
    function col(pred){for(var k=0;k<h.length;k++){if(pred(h[k]))return k}return -1}
    var ix={
      date:col(function(x){return x==='Date'}),
      title:col(function(x){return x.indexOf('Entra')===0}),
      time:col(function(x){return x==='Heure'}),
      ex:col(function(x){return x==='Exercice'}),
      type:col(function(x){return x.indexOf('chauffement')>=0}),
      rep:col(function(x){return x.indexOf('pétitions')>=0}),
      w:col(function(x){return x.indexOf('Poids')===0}),
      skip:col(function(x){return x.indexOf('Saut')===0}),
      prim:col(function(x){return x.indexOf('Primaires')>=0}),
      sec:col(function(x){return x.indexOf('Secondaires')>=0}),
      note:col(function(x){return x==='Notes'})
    };
    if(ix.date<0||ix.ex<0||ix.type<0||ix.rep<0||ix.w<0||ix.skip<0)return {error:'Format non reconnu. Choisissez un export CSV de GymBook.'};
    var map=new Map(),st={skipped:0,warm:0,empty:0,sets:0},days=new Set();
    for(var r=1;r<rows.length;r++){
      var row=rows[r];if(row.length<h.length-1)continue;
      if(String(row[ix.skip]).trim()==='Oui'){st.skipped++;continue}
      if(String(row[ix.type]).indexOf('chauffement')>=0){st.warm++;continue}
      var dm=String(row[ix.date]).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!dm)continue;
      var iso=dm[3]+'-'+pad(dm[2])+'-'+pad(dm[1]);
      var title=ix.title>=0?String(row[ix.title]).trim():'',name=String(row[ix.ex]).trim();
      if(!name)continue;
      var repTxt=String(row[ix.rep]),wTxt=String(row[ix.w]),v=pnum(repTxt),set={reps:null,kg:null};
      if(/minute/i.test(repTxt))set.t=Math.round((v||0)*60);
      else if(/seconde/i.test(repTxt))set.t=Math.round(v||0);
      else set.reps=v==null?null:Math.round(v);
      var wv=pnum(wTxt);
      if(/km/i.test(wTxt)){if(wv)set.km=wv}else if(wv!=null)set.kg=wv;
      var nt=ix.note>=0?String(row[ix.note]||'').trim():'';
      if(nt)set.n=nt.slice(0,80);
      if(!(set.reps>0||set.t>0||set.km>0)){st.empty++;continue}
      var key=iso+'|'+title,s=map.get(key);
      if(!s){s={id:'imp-'+iso.replace(/-/g,'')+'-'+(slug(title)||'seance'),date:iso,title:title,exercises:[],note:'',updatedAt:0,_x:new Map()};map.set(key,s)}
      var kx=normKey(name),ex=s._x.get(kx);
      if(!ex){
        ex={id:uid8(),name:name,sets:[]};
        var gp=ix.prim>=0?normG(row[ix.prim]):[];if(gp.length)ex.g=gp;
        var gs=ix.sec>=0?normG(row[ix.sec]):[];if(gs.length)ex.g2=gs;
        s._x.set(kx,ex);s.exercises.push(ex);
      }
      ex.sets.push(set);st.sets++;days.add(iso);
      var tm=String(row[ix.time]||'').match(/(\d{1,2}):(\d{2})/);
      var stamp=parseDate(iso).getTime()+(tm?(Number(tm[1])*60+Number(tm[2]))*60000:0);
      if(stamp>s.updatedAt)s.updatedAt=stamp;
    }
    var byDate={},drop=[];
    map.forEach(function(s){(byDate[s.date]=byDate[s.date]||[]).push(s)});
    Object.keys(byDate).forEach(function(d){
      var L=byDate[d],titled=L.filter(function(s){return s.title}),blank=L.filter(function(s){return !s.title});
      if(titled.length===1&&blank.length){
        var T=titled[0];
        blank.forEach(function(b){
          b.exercises.forEach(function(e){
            var f=T.exercises.filter(function(x){return normKey(x.name)===normKey(e.name)})[0];
            if(f)f.sets=f.sets.concat(e.sets);else T.exercises.push(e);
          });
          if(b.updatedAt>T.updatedAt)T.updatedAt=b.updatedAt;
          drop.push(b.id);
        });
      }
    });
    var out=[],seen={};
    map.forEach(function(s){delete s._x;var id=s.id,n=2;while(seen[id])id=s.id+'-'+(n++);seen[id]=1;s.id=id;out.push(s)});
    var ds=Array.from(days).sort();
    st.sessions=out.length;st.days=days.size;st.first=ds[0];st.last=ds[ds.length-1];
    return {sessions:out,stats:st,drop:drop};
  }
  async function handleImpFile(file){
    if(!file)return;
    state.imp={reading:true};
    renderHisto();
    try{
      var buf=new Uint8Array(await file.arrayBuffer()),enc='utf-8';
      if(buf[0]===0xFF&&buf[1]===0xFE)enc='utf-16le';else if(buf[0]===0xFE&&buf[1]===0xFF)enc='utf-16be';
      var res=buildImport(csvParse(new TextDecoder(enc).decode(buf)));
      if(res.error)state.imp={error:res.error};
      else if(!res.sessions.length)state.imp={error:'Aucune série effectuée trouvée dans ce fichier.'};
      else state.imp={sessions:res.sessions,stats:res.stats,drop:res.drop};
    }catch(e){state.imp={error:'Lecture du fichier impossible.'}}
    renderHisto();
  }
  async function runImport(){
    var m=state.imp;if(!m||m.busy)return;
    m.busy=true;m.done=0;m.failed=0;state.importing=true;renderHisto();
    var list=m.sessions,idx=0,total=list.length;
    function prog(){var el=$('#impstat');if(el)el.textContent='Import en cours : '+(m.done+m.failed)+' / '+total+' séances'}
    async function writeOne(s){
      var i=state.sessions.findIndex(function(x){return x.id===s.id});
      if(i>=0)state.sessions[i]=s;else state.sessions.push(s);
      return true;
    }
    async function worker(){
      while(idx<total){var s=list[idx++];var ok=await writeOne(clone(s));if(ok)m.done++;else m.failed++;prog()}
    }
    await Promise.all([worker(),worker(),worker()]);
    var dr=m.drop||[];
    for(var di=0;di<dr.length;di++){state.sessions=state.sessions.filter(function(x){return x.id!==dr[di]})}
    localSave();
    invalidateCaches();
    m.busy=false;m.finished=true;state.importing=false;
    renderHisto();
  }
  function fmtFull(s){return parseDate(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}
  function impHTML(){

  /* ---------- Progression ---------- */
  function niceStep(r){var p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
  function renderProg(){
    var el=$('#v-prog'),list=allSessions().slice().reverse();
    var head='<header class="head"><h1>Progression</h1><p class="sum">Meilleure série de chaque séance</p></header>';
    var counts=new Map(),names=new Map();
    list.forEach(function(s){s.exercises.forEach(function(e){var k=normKey(e.name);counts.set(k,(counts.get(k)||0)+1);names.set(k,e.name)})});
    if(!counts.size){el.innerHTML=head+'<div class="empty"><strong>Pas encore de courbe</strong>Enregistrez quelques séances.</div>';return}
    var keys=Array.from(counts.keys()).sort(function(a,b){return counts.get(b)-counts.get(a)});
    if(!state.chartEx||!counts.has(state.chartEx))state.chartEx=keys[0];
    var key=state.chartEx,pts=[];
    list.forEach(function(s){
      var ex=s.exercises.find(function(e){return normKey(e.name)===key});
      if(ex&&ex.sets.length)pts.push({date:s.date,sets:ex.sets});
    });
    var kgCount=pts.filter(function(p){return p.sets.some(function(x){return x.kg>0&&x.reps>0})}).length;
    var useKg=kgCount>0&&kgCount*2>=pts.length;
    var useReps=!useKg&&pts.some(function(p){return p.sets.some(function(x){return x.reps>0})});
    var useT=!useKg&&!useReps&&pts.some(function(p){return p.sets.some(function(x){return x.t>0})});
    function mv(x){return useKg?e1rm(x):useReps?(x.reps||0):useT?(x.t||0)/60:(x.km||0)}
    pts.forEach(function(p){var b=0,bs=null;p.sets.forEach(function(x){var v=mv(x);if(v>b){b=v;bs=x}});p.v=b;p.best=bs});
    var unit=useKg?'kg':useReps?'reps':useT?'min':'km';
    var opts=keys.map(function(k){return '<option value="'+esc(k)+'"'+(k===key?' selected':'')+'>'+esc(names.get(k))+' ('+counts.get(k)+')</option>'}).join('');
    var vs=pts.map(function(p){return p.v}),lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
    var step=niceStep(((hi-lo)||Math.max(hi,1)*0.2)/3);
    var y0=Math.floor(lo/step)*step,y1=Math.ceil(hi/step)*step;if(y1===y0)y1=y0+step;
    var W=360,H=220,L=42,R=16,T=18,B=28,pw=W-L-R,ph=H-T-B;
    var t0=parseDate(pts[0].date).getTime(),t1=parseDate(pts[pts.length-1].date).getTime();
    function X(p){return t1===t0?L+pw/2:L+(parseDate(p.date).getTime()-t0)/(t1-t0)*pw}
    function Y(v){return T+ph-(v-y0)/(y1-y0)*ph}
    var grid='',tick=y0;
    for(var n=0;tick<=y1+step/1000&&n<8;n++,tick+=step){
      grid+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(tick)+'" y2="'+Y(tick)+'"/><text x="'+(L-6)+'" y="'+(Y(tick)+4)+'" text-anchor="end">'+num(tick,1)+'</text>';
    }
    var path=pts.map(function(p,i){return (i?'L':'M')+X(p).toFixed(1)+' '+Y(p.v).toFixed(1)}).join('');
    var dots=pts.map(function(p,i){return '<circle class="pt'+(i===pts.length-1?' last':'')+'" cx="'+X(p).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(i===pts.length-1?5:4)+'"/>'}).join('');
    var lp=pts[pts.length-1],lx=X(lp);
    var lbl='<text class="val" x="'+lx.toFixed(1)+'" y="'+(Y(lp.v)-10).toFixed(1)+'" text-anchor="middle">'+num(lp.v,1)+'</text>';
    var xl='<text x="'+L+'" y="'+(H-8)+'" text-anchor="start">'+esc(fmtShort(pts[0].date))+'</text>'+(pts.length>1?'<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+esc(fmtShort(lp.date))+'</text>':'');

  function exPR(ex){

    ex.sets.forEach(function(s,i){var sc=s.kg>0?e1rm(s):(s.reps||0)/1000;if(sc>bs){bs=sc;best=i}});

  /* ---------- Bilan ---------- */
  var DAYS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function weekRange(off){
    var t=new Date(),d=new Date(t.getFullYear(),t.getMonth(),t.getDate());
    d.setDate(d.getDate()-((d.getDay()-state.wkStart+7)%7)-7*off);
    var e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+6);
    return {start:isoOf(d),end:isoOf(e)};
  }
  function sessionsIn(a,b){return allSessions().filter(function(s){return s.date>=a&&s.date<=b})}
  function buildGmap(){
    if(_gmapCache)return _gmapCache;
    var m={};
    allSessions().forEach(function(s){s.exercises.forEach(function(e){if(e.g&&e.g.length)m[normKey(e.name)]={g:e.g,g2:e.g2||[]}})});
    return _gmapCache=m;
  }
  function groupsFor(name,gmap){
    var k=normKey(name);if(gmap[k])return gmap[k];
    for(var i=0;i<HEUR.length;i++){if(HEUR[i][0].test(name))return {g:[HEUR[i][1]],g2:[]}}
    return {g:['Autre'],g2:[]};
  }
  function rirOf(n){
    var s=String(n),m;
    if(/[ée]chec/i.test(s)&&!/rir|rpe/i.test(s))return {lo:0,hi:0};
    m=s.match(/rpe\s*:?\s*(\d+(?:[.,]\d+)?)/i);
    if(m){var v=Math.max(10-Number(m[1].replace(',','.')),0);return {lo:v,hi:v}}
    m=s.match(/(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*\??\s*rir/i)||s.match(/rir\s*:?\s*(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?/i);
    if(!m&&/^\s*\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?\s*$/.test(s))m=s.match(/(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?/);
    if(!m)return null;
    var lo=Number(m[1].replace(',','.')),hi=m[2]?Number(m[2].replace(',','.')):lo;
    return {lo:Math.min(lo,hi),hi:Math.max(lo,hi)};
  }
  function pureRir(n){return /^\s*(rir\s*:?\s*)?\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?\s*\??\s*(rir)?\s*\??\s*$/i.test(n)}
  function weekStats(list,gmap){
    var st={seances:list.length,series:0,volume:0,groupes:{},annotees:0,echec:0,rirSum:0,notes:[]};
    list.forEach(function(s){
      st.volume+=sessVol(s);
      s.exercises.forEach(function(e){
        var gg=groupsFor(e.name,gmap);
        e.sets.forEach(function(x){
          st.series++;
          gg.g.forEach(function(g){var o=st.groupes[g]||(st.groupes[g]={directes:0,indirectes:0});o.directes++});
          gg.g2.forEach(function(g){var o=st.groupes[g]||(st.groupes[g]={directes:0,indirectes:0});o.indirectes++});
          if(x.n){
            var r=rirOf(x.n);
            if(r){st.annotees++;if(r.hi<=0)st.echec++;st.rirSum+=(r.lo+r.hi)/2}
            if(!pureRir(x.n))st.notes.push({date:s.date,exercice:e.name,note:x.n});
          }
        });
      });
    });
    return st;
  }
  function startTitles(){
    var c={},f={};
    allSessions().forEach(function(s){var t=(s.title||'').trim();if(!t)return;var k=normKey(t);c[k]=(c[k]||0)+1;f[k]=t});
    return Object.keys(c).sort(function(a,b){return c[b]-c[a]}).map(function(k){return f[k]});
  }
  function resolveTitle(){
    var ts=startTitles(),cur=normKey(state.cycTitle);
    if(cur&&ts.some(function(t){return normKey(t)===cur}))return state.cycTitle;
    var pa=ts.filter(function(t){return /^pull a$/i.test(t)})[0];
    return pa||ts[0]||'';
  }
  function cycles(){
    var key=normKey(resolveTitle());
    var asc=allSessions().slice().sort(function(a,b){return a.date.localeCompare(b.date)||(a.updatedAt||0)-(b.updatedAt||0)});
    var out=[],cur=null,prev=null;
    asc.forEach(function(s){
      var t=normKey(s.title);
      var gap=prev?Math.round((parseDate(s.date)-parseDate(prev.date))/864e5):0;
      var again=key&&t===key&&cur&&cur.list.some(function(x){return normKey(x.title)===key});
      if(!cur||again||gap>=8||cur.list.length>=7){cur={list:[]};out.push(cur)}
      cur.list.push(s);prev=s;
    });
    return out.reverse().map(function(c){
      var l=c.list.slice().reverse();
      return {start:l[l.length-1].date,end:l[0].date,list:l};
    });
  }
  function getPeriod(off){
    if(state.wkMode==='cycle'){
      var cs=cycles(),c=cs[off];
      if(!c)return {start:'',end:'',list:[],partial:false};

      if(off===0){
        var ls=cs.slice(1,4).map(function(x){return x.list.length}).sort(function(a,b){return a-b});
        var med=ls.length?ls[Math.floor(ls.length/2)]:0;
        partial=c.list.length<med;
      }
      return {start:c.start,end:c.end,list:c.list,partial:partial};
    }
    var r=weekRange(off);
    return {start:r.start,end:r.end,list:sessionsIn(r.start,r.end),partial:off===0&&r.end>=todayStr()};
  }

    try{
      var hist=c.chat.slice(-10).map(function(m){return (m.role==='user'?'Utilisateur : ':'Coach : ')+m.text}).join('\n\n');
      var prompt=coachSystem()+'\n\n--- Conversation ---\n'+hist+'\n\nRéponds au dernier message.';
      var sample=await getSample();
      var res=await sample(prompt,{onText:function(t){
        if(signal.aborted)return;
        a.live=t.text;
        var el=document.querySelector('.msg.bot .msgbody');
        if(el&&state.coach===a)el.textContent=t.text;
      }});
      if(signal.aborted)return;
      a.busy=false;a.live=null;
      var text=String(res&&res.text||'').trim();
      if(text){c.chat.push({role:'assistant',text:text,at:Date.now()});markDirty()}
      else a.error="Réponse vide.";
      renderCoach();
    }catch(e){
      if(signal.aborted)return;
      a.busy=false;a.live=null;
      a.error="Le coach a échoué. "+((e&&e.message)||'');
      renderCoach();
    }
  }
  function coachStop(){
    if(coachAbort)coachAbort.abort();
    state.coach.busy=false;state.coach.live=null;renderCoach();
  }

  /* ---------- Navigation ---------- */
  function renderAll(){
    ['seance','histo','prog','bilan','coach'].forEach(function(t){$('#v-'+t).hidden=state.tab!==t});
    document.querySelectorAll('nav button').forEach(function(b){
      if(b.dataset.tab===state.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
    });
    if(state.tab==='seance')renderSeance();
    else if(state.tab==='histo')renderHisto();
    else if(state.tab==='bilan')renderBilan();
    else if(state.tab==='coach')renderCoach();
    else renderProg();
  }
  function setConfirm(v){
    state.confirm=v;clearTimeout(confirmTimer);
    if(v)confirmTimer=setTimeout(function(){state.confirm=null;if(state.tab==='seance')renderSeance()},4000);
  }

  /* ---------- Actions ---------- */
  function addExercise(name){
    name=(name||'').trim();if(!name)return;
    var c=state.cur,found=c.exercises.find(function(e){return normKey(e.name)===normKey(name)});
    if(found){renderSeance('#r-'+found.id+'-0-reps');return}
    var canon=nameList().find(function(n){return normKey(n)===normKey(name)})||name;
    var ex={id:uid8(),name:canon,sets:[]};
    ex.sets.push(defaultSet(canon,null));
    c.exercises.push(ex);markDirty();renderSeance('#r-'+ex.id+'-0-reps');
  }
  function findEx(id){return state.cur.exercises.find(function(e){return e.id===id})}

  document.addEventListener('click',function(ev){
    var t=ev.target.closest('[data-act]');if(!t)return;
    var act=t.dataset.act,c=state.cur;
    if(act==='tab'){state.tab=t.dataset.tab;setConfirm(null);renderAll();window.scrollTo(0,0)}
    else if(act==='add-ex'){addExercise($('#newex').value)}
    else if(act==='quick'){addExercise(t.dataset.name)}
    else if(act==='add-set'){
      var ex=findEx(t.dataset.ex);if(!ex)return;
      ex.sets.push(defaultSet(ex.name,ex));markDirty();
      renderOneExercise(ex.id);
      var f=$('#r-'+ex.id+'-'+(ex.sets.length-1)+'-reps');if(f){f.focus({preventScroll:true});if(f.select)f.select()}
      updateSum();
    }
    else if(act==='del-set'){
      var row=t.closest('.set'),ex2=findEx(row.dataset.ex);if(!ex2)return;
      ex2.sets.splice(Number(row.dataset.i),1);markDirty();renderOneExercise(ex2.id);updateSum();
    }
    else if(act==='del-ex'){
      var id=t.dataset.ex;
      if(state.confirm==='ex:'+id){setConfirm(null);c.exercises=c.exercises.filter(function(e){return e.id!==id});markDirty()}
      else setConfirm('ex:'+id);
      renderSeance();
    }
    else if(act==='del-session'){
      if(state.confirm==='sess'){
        setConfirm(null);var old=c.id;state.cur=newSession();dirty=false;state.saveState='idle';
        clearTimeout(saveTimer);removeSession(old).then(function(){onSessions()});renderSeance();
      }else{setConfirm('sess');renderSeance()}
    }
    else if(act==='new-session'){
      clearTimeout(saveTimer);
      if(dirty){var toSave=clone(state.cur);chain=chain.then(function(){return doSaveSnapshot(toSave)}).catch(function(){})}
      state.cur=newSession();dirty=false;state.saveState='idle';setConfirm(null);state.tab='seance';renderAll();window.scrollTo(0,0);
    }
    else if(act==='analyze'){analyze()}
    else if(act==='wk-prev'){if(state.wkMode!=='cycle'||state.wkOff<cycles().length-1){state.wkOff++;renderBilan()}}
    else if(act==='wk-next'){if(state.wkOff>0){state.wkOff--;renderBilan()}}
    else if(act==='wk-analyze'){analyzeWeek()}
    else if(act==='more'){state.histoN+=40;renderHisto()}
    else if(act==='imp-go'){runImport()}
    else if(act==='imp-cancel'){state.imp=null;renderHisto()}
    else if(act==='open'){
      var s=state.sessions.find(function(x){return x.id===t.dataset.id});
      if(!s)return;
      clearTimeout(saveTimer);
      if(dirty){var toSave2=clone(state.cur);chain=chain.then(function(){return doSaveSnapshot(toSave2)}).catch(function(){})}
      state.cur=clone(s);dirty=false;state.saveState='idle';setConfirm(null);state.tab='seance';renderAll();window.scrollTo(0,0);
    }
    else if(act==='coach-send'){var q=$('#coachq');if(q)coachSend(q.value)}
    else if(act==='coach-ask'){coachSend(t.dataset.q)}
    else if(act==='coach-stop'){coachStop()}
  });

  document.addEventListener('input',function(ev){
    var t=ev.target,c=state.cur;
    if(t.dataset&&t.dataset.field){
      var row=t.closest('.set'),ex=findEx(row.dataset.ex);if(!ex)return;
      var s0=ex.sets[Number(row.dataset.i)];
      if(t.dataset.field==='n'){var nv=t.value.slice(0,80);if(nv.trim())s0.n=nv;else delete s0.n;markDirty();return}
      var raw=t.value.replace(',','.').trim(),v=raw===''?null:Number(raw);
      if(v!==null&&(isNaN(v)||v<0))return;
      if(t.dataset.field==='reps')s0.reps=v===null?null:Math.round(v);else s0.kg=v;
      markDirty();updateSum();updatePR();
    }else if(t.id==='snote'){c.note=t.value;markDirty()}
    else if(t.id==='sname'){c.title=t.value;markDirty();updateSum()}
  });
  document.addEventListener('change',function(ev){
    var t=ev.target;
    if(t.id==='sdate'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){state.cur.date=t.value;$('#stitle').textContent=fmtLong(t.value);markDirty()}
    else if(t.id==='exsel'){state.chartEx=t.value;renderProg()}
    else if(t.id==='impfile'){handleImpFile(t.files&&t.files[0])}
    else if(t.id==='wkmode'){state.wkMode=t.value==='cal'?'cal':'cycle';state.wkOff=0;try{localStorage.setItem('carnet-muscu.wkmode',state.wkMode)}catch(e){}renderBilan()}
    else if(t.id==='cyctitle'){state.cycTitle=t.value;state.wkOff=0;try{localStorage.setItem('carnet-muscu.cyctitle',state.cycTitle)}catch(e){}renderBilan()}
    else if(t.id==='wkstart'){state.wkStart=Number(t.value);state.wkOff=0;try{localStorage.setItem('carnet-muscu.wkstart',String(state.wkStart))}catch(e){}renderBilan()}
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'&&ev.target.id==='newex'){ev.preventDefault();addExercise(ev.target.value)}
    if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.id==='coachq'){ev.preventDefault();coachSend(ev.target.value)}
  });

  state.cur=newSession();
  renderAll();
  initStore();
})();
</script>
</body></html>
