<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --fg:#1C1C1E; --muted:#8E8E93; --rule:#E5E5EA;
  --accent:#20B2AA; --accent-fg:#FFFFFF; --accent-light:#E0F7F6;
  --danger:#FF3B30; --blue:#007AFF; --success:#34C759;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --fg:#FFFFFF; --muted:#8E8E93; --rule:#38383A;
    --accent:#2AC9C0; --accent-light:#1A2E2E;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--fg); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; font-size:16px; line-height:1.4; padding-block:16px 96px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); overflow-x:hidden}
.wrap{max-width:600px; margin:0 auto}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1{font-weight:800; font-size:32px; margin:0 0 4px 0; letter-spacing:-0.5px}
h2{font-weight:700; font-size:22px; margin:0 0 12px 0}
h3{font-weight:600; font-size:17px; margin:0}

/* ANIMATIONS */
@keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(32, 178, 170, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(32, 178, 170, 0); } 100% { box-shadow: 0 0 0 0 rgba(32, 178, 170, 0); } }
section:not([hidden]) { animation: fadeInUp 0.3s ease forwards; }

/* UI */
.head{margin-bottom:20px; padding-top:8px}
.head .line{display:inline-block; width:40px; height:4px; background:var(--accent); border-radius:2px; margin-top:6px}
.card{background:var(--surface); border-radius:16px; overflow:hidden; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,0.03)}
.row{display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--rule); gap:12px}
.row:last-child{border-bottom:0}
.row:active{background-color:var(--rule)}
.r-left{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
.r-title{font-weight:600; font-size:17px}
.r-sub{font-size:13px; color:var(--muted)}
.badge-jours{background:#E8E8ED; color:#555; font-size:13px; font-weight:600; padding:4px 10px; border-radius:12px; display:flex; align-items:center; gap:4px}
.badge-jours .check{color:var(--accent); font-size:12px}
.info-btn{background:transparent; border:2px solid var(--accent); color:var(--accent); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700}
.chevron{color:#C7C7CC; font-size:20px; font-weight:400}
.icon-btn{background:var(--bg); border:0; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--fg)}
.btn{min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--rule); background:var(--surface); font-weight:600; font-size:15px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent; border-color:transparent; color:var(--accent)}
input[type="text"], input[type="number"], input[type="date"], textarea{width:100%; border:1px solid var(--rule); border-radius:10px; background:var(--bg); padding:12px; font-size:16px; color:var(--fg); outline:none}
input:focus{border-color:var(--accent)}
nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--rule); z-index:20; padding-bottom:env(safe-area-inset-bottom, 0px); display:flex; justify-content:space-around; height:64px; padding-top:8px}
nav button{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); font-size:10px; font-weight:600; padding:0 8px; flex:1}
nav button svg{width:24px; height:24px; fill:currentColor}
nav button.active{color:var(--accent)}

/* Écran Séance */
.session-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px}
.ex-row{display:flex; align-items:center; padding:16px; border-bottom:1px solid var(--rule); gap:12px; cursor:pointer}
.ex-illu{width:50px; height:50px; background:#F0F0F5; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:10px; flex-shrink:0}
.ex-info{flex:1; display:flex; flex-direction:column; gap:4px}
.ex-title{font-weight:600; font-size:16px}
.ex-sub{font-size:13px; color:var(--muted)}

/* Écran Exercice */
.exo-detail-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px}
.exo-detail-title{font-size:32px; font-weight:800; line-height:1.1; letter-spacing:-0.5px; margin-bottom:20px}
.set-history-row{display:flex; align-items:center; padding:12px 0; border-bottom:1px solid var(--rule); gap:12px}
.set-check{width:36px; height:36px; border-radius:50%; background:var(--bg); border:2px solid var(--rule); color:transparent; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer}
.set-check.done{background:var(--accent); border-color:var(--accent); color:#fff}
.set-inputs{display:flex; gap:8px; width:140px}
.set-inputs input{width:60px; text-align:center; padding:8px; font-weight:700; height:40px}
.set-history-text{flex:1; text-align:right; color:var(--muted); font-size:13px; line-height:1.6}

/* Timer */
.timer-bar{position:fixed; bottom:64px; left:0; right:0; background:var(--surface); border-top:1px solid var(--rule); padding:12px 16px; display:flex; align-items:center; gap:16px; z-index:10}
.timer-display{font-family:monospace; font-size:24px; font-weight:700; color:var(--muted); flex:1; text-align:center}
.timer-active{animation: pulseGlow 2s infinite; background-color: var(--accent-light) !important; color: var(--accent) !important; border-color: var(--accent) !important}

/* Modale */
.modal-overlay{position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:100; display:flex; align-items:flex-end}
.modal-content{background:var(--surface); width:100%; max-height:80vh; border-top-left-radius:20px; border-top-right-radius:20px; padding:20px; padding-bottom:env(safe-area-inset-bottom, 20px); overflow-y:auto}
.modal-ex-list{list-style:none; padding:0; margin:0}
.modal-ex-list li{padding:12px; border-bottom:1px solid var(--rule); cursor:pointer; font-weight:600}
.modal-ex-list li:active{background:var(--bg)}

/* Coach Chat */
.chat-container{display:flex; flex-direction:column; gap:12px; margin-bottom:16px}
.msg{max-width:85%; padding:12px 16px; border-radius:20px; font-size:15px; line-height:1.4}
.msg.user{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start; background:var(--surface); border:1px solid var(--rule); border-bottom-left-radius:4px}

/* Calendrier */
.cal { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow:0 2px 8px rgba(0,0,0,0.03) }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.cal-head button { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; width: 36px; height: 36px; color: var(--fg); font-size: 18px; display: flex; align-items: center; justify-content: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 8px 0; }
.cal-day-name { font-size: 12px; font-weight: 600; color: var(--muted); padding-bottom: 8px; }
.cal-day { position: relative; padding: 8px 0; font-size: 15px; font-weight: 500; cursor: pointer; border-radius: 50%; color: var(--fg); }
.cal-day.has-workout { color: var(--accent); font-weight: 700; }
.cal-day.has-workout::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
</style>

(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var LS_KEY='carnet-muscu.v2'; // Version 2 pour éviter les conflits avec l'ancien code
  var state={tab:'entrainements',sessions:[],templates:[],currentSession:null,currentExoIdx:null,chat:[]};
  var currentDate = new Date();
  var calMonth = currentDate.getMonth();
  var calYear = currentDate.getFullYear();
  var timerInt = null, timerSec = 0, timerRunning = false;

  function haptic() { if (navigator.vibrate) navigator.vibrate(10); }
  function uid8(){return Math.random().toString(36).slice(2,10)}
  function pad(n){return String(n).padStart(2,'0')}
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function parseDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
  function fmtShort(s){return parseDate(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}

  function initStore(){
    try{state.sessions=JSON.parse(localStorage.getItem(LS_KEY)||'[]')}catch(e){state.sessions=[]}
    try{state.templates=JSON.parse(lsGet('carnet-muscu.templates','[]'))}catch(e){state.templates=[]}
    
    if(!state.templates.length){
      state.templates = [
        {id:'t1', title:'Pull A', desc:'Pectoraux Dos Bras', exercises:['Curl Pupitre à Un Bras avec Haltère, Debout','Curl à la Barre','Rowing à la Barre, Buste Penché, Prise Inversée','Pull-Over avec Haltère','Curl à la Barre, Prise Inversée','Haussement d\'Épaules à la Barre Hexagonale']},

      saveTemplates();
    }
    renderAll();
  }
  function saveSessions(){try{localStorage.setItem(LS_KEY,JSON.stringify(state.sessions))}catch(e){}}
  function saveTemplates(){try{localStorage.setItem('carnet-muscu.templates',JSON.stringify(state.templates))}catch(e){}}
  
  // Sauvegarde automatique de la séance en cours
  function saveCurrentSession(){
    if (!state.currentSession) return;
    var idx = state.sessions.findIndex(s => s.id === state.currentSession.id);
    if (idx >= 0) state.sessions[idx] = JSON.parse(JSON.stringify(state.currentSession));
    else state.sessions.push(JSON.parse(JSON.stringify(state.currentSession)));
    saveSessions();
  }

  async function getSample(){
    return async function(prompt, options){
      const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
      if (!res.ok) throw new Error('Erreur API');
      const reader = res.body.getReader(), decoder = new TextDecoder();
      let fullText = '', buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n'); buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) { fullText += delta; if (options?.onText) options.onText({ text: fullText }); }
          } catch (e) {}
        }
      }
      return { text: fullText };
    };
  }

  function renderEntrainements(){
    var today = new Date();
    var tplsHtml = state.templates.map(function(t){
      var lastDone = state.sessions.filter(s => s.title === t.title).sort((a,b)=>b.date.localeCompare(a.date))[0];
      var daysAgo = 'Nouveau';
      if(lastDone){
        var diff = Math.floor((today - parseDate(lastDone.date)) / (1000 * 60 * 60 * 24));
        daysAgo = diff === 0 ? "Auj." : diff + " j";
      }
      return `
        <div class="row" data-act="start-tpl" data-id="${t.id}">
          <div class="r-left"><div class="r-title">${esc(t.title)}</div><div class="r-sub">${esc(t.desc)}</div></div>
          <div style="display:flex; align-items:center; gap:12px"><div class="badge-jours"><span class="check">✓</span> ${daysAgo}</div><div class="chevron">›</div></div>
        </div>
      `;
    }).join('');
    $('#v-entrainements').innerHTML = `<div class="head"><h1>Entraînements</h1><div class="line"></div></div><div class="card">${tplsHtml}</div>`;
  }

  function renderExercices(){
    var groups = {};
    EXERCISES_DB.forEach(function(ex) {
      if (!groups[ex.r]) groups[ex.r] = [];
      groups[ex.r].push(ex);
    });
    var html = Object.keys(groups).sort().map(function(g) {
      var list = groups[g].map(function(ex) { return `<div class="row"><div class="r-title">${esc(ex.n)}</div></div>`; }).join('');
      return `<h3 style="padding:16px 16px 8px; font-size:14px; text-transform:uppercase; color:var(--muted)">${esc(g)}</h3><div class="card">${list}</div>`;
    }).join('');
    $('#v-exercices').innerHTML = `<div class="head"><h1>Exercices</h1><div class="line"></div></div><div style="margin-bottom:16px">${html}</div>`;
  }

  function renderHistorique(){
    var monthNames = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
    var firstDay = new Date(calYear, calMonth, 1).getDay();
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    var offset = (firstDay === 0 ? 6 : firstDay - 1);
    var daysHtml = '';
    for (var i = 0; i < offset; i++) daysHtml += '<div></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = calYear + '-' + pad(calMonth+1) + '-' + pad(d);
      var sessionOnDay = state.sessions.find(s => s.date === dateStr);
      daysHtml += `<div class="cal-day ${sessionOnDay ? 'has-workout' : ''}" data-act="view-day" data-id="${sessionOnDay ? sessionOnDay.id : ''}">${d}</div>`;
    }
    $('#v-historique').innerHTML = `
      <div class="head"><h1>Historique</h1><div class="line"></div></div>
      <div class="cal">
        <div class="cal-head"><button data-act="cal-prev">‹</button><div style="font-weight:700; font-size:18px">${monthNames[calMonth]} ${calYear}</div><button data-act="cal-next">›</button></div>
        <div class="cal-grid"><div class="cal-day-name">L</div><div class="cal-day-name">M</div><div class="cal-day-name">M</div><div class="cal-day-name">J</div><div class="cal-day-name">V</div><div class="cal-day-name">S</div><div class="cal-day-name">D</div>${daysHtml}</div>
      </div>
    `;
  }

  function renderMensurations(){ $('#v-mensurations').innerHTML = `<div class="head"><h1>Mensurations</h1><div class="line"></div></div><div class="card"><div class="row"><div class="r-title">Poids</div><div class="r-sub">83,70 kg</div></div></div>`; }
  function renderReglages(){ $('#v-reglages').innerHTML = `<div class="head"><h1>Réglages</h1><div class="line"></div></div><div class="card"><div class="row" data-act="tab" data-tab="coach"><div class="r-title">Coach IA</div><div class="chevron">›</div></div></div>`; }

  function renderSeance(){
    if(!state.currentSession) return;
    var exHtml = state.currentSession.exercises.map(function(ex, i){
      var setsCount = ex.sets.length;
      var minReps = Math.min(...ex.sets.map(s=>s.reps||0));
      var maxReps = Math.max(...ex.sets.map(s=>s.reps||0));
      var maxKg = Math.max(...ex.sets.map(s=>s.kg||0));
      var rangeReps = minReps === maxReps ? `${maxReps}` : `${minReps}-${maxReps}`;
      return `
        <div class="ex-row" data-act="open-exo" data-index="${i}">
          <div class="ex-info"><div class="ex-title">${esc(ex.name)}</div><div class="ex-sub">${setsCount} séries • ${rangeReps} reps • ${maxKg > 0 ? maxKg.toFixed(1)+' kg' : 'Pdc'}</div></div>
          <div class="chevron">›</div>
        </div>`;
    }).join('');
    $('#v-seance').innerHTML = `
      <div class="session-header">
        <button class="icon-btn" data-act="tab" data-tab="entrainements">←</button>
        <div style="display:flex; gap:8px">
          <button class="icon-btn" data-act="open-modal">+</button>
          <button class="btn primary" data-act="finish-session">Terminer</button>
        </div>
      </div>
      <h1 class="head">${esc(state.currentSession.title)}</h1>
      <div class="card">${exHtml}</div>
    `;
  }

  function renderExoDetail(){
    if(state.currentExoIdx === null || !state.currentSession) return;
    var ex = state.currentSession.exercises[state.currentExoIdx];
    var pastSessions = state.sessions.filter(s => s.id !== state.currentSession.id && s.exercises.some(e => e.name === ex.name)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);

    var setsHtml = ex.sets.map(function(s, j){
      var historyLines = pastSessions.map(ps => {
        var pex = ps.exercises.find(e => e.name === ex.name);
        var pset = pex.sets[j];
        if(!pset) return '';
        return `<div>${fmtShort(ps.date)} : ${pset.reps}×${Number(pset.kg).toFixed(1)}kg</div>`;
      }).join('');
      return `
        <div class="set-history-row">
          <div class="set-check ${s.done ? 'done' : ''}" data-act="toggle-set" data-set-index="${j}">✓</div>
          <div class="set-inputs">
            <input type="text" inputmode="numeric" value="${s.reps||''}" data-set-index="${j}" data-field="reps" placeholder="Reps">
            <input type="text" inputmode="decimal" value="${s.kg||''}" data-set-index="${j}" data-field="kg" placeholder="Kg">
          </div>
          <div class="set-history-text">${historyLines || 'Nouveau'}</div>
        </div>`;
    }).join('');

    $('#v-exo-detail').innerHTML = `
      <div class="exo-detail-header">
        <button class="icon-btn" data-act="back-to-session">←</button>
        <button class="icon-btn" data-act="timer-show">⏱️</button>
      </div>
      <div class="exo-detail-title">${esc(ex.name)}</div>
      <div class="card" style="padding:16px;">
        ${setsHtml}
        <button class="btn ghost" style="width:100%; margin-top:12px" data-act="add-set">+ Série</button>
      </div>
    `;
    $('#timer-bar').hidden = false;
  }

  function renderCoach(){
    var msgs = state.chat.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join('');
    $('#v-coach').innerHTML = `
      <div class="head"><h1>Coach IA</h1><div class="line"></div></div>
      <div class="chat-container" id="chatlist">${msgs || '<div class="msg bot">Posez-moi une question.</div>'}</div>
      <div style="display:flex; gap:8px;"><input type="text" id="chat-in" placeholder="Votre question..."><button class="btn primary" data-act="send-chat">→</button></div>
    `;
  }

  function renderModalExercises(query){
    var q = (query||'').toLowerCase();
    var filtered = EXERCISES_DB.filter(ex => ex.n.toLowerCase().includes(q));
    $('#modal-ex-list').innerHTML = filtered.slice(0, 50).map(ex => `<li data-act="add-exo-modal" data-name="${esc(ex.n)}">${esc(ex.n)}</li>`).join('');
  }

  function renderAll(){
    ['entrainements','exercices','historique','mensurations','reglages','seance','exo-detail','coach'].forEach(function(t){$('#v-'+t).hidden=state.tab!==t});
    document.querySelectorAll('nav button').forEach(function(b){ if(b.dataset.tab===state.tab) b.classList.add('active'); else b.classList.remove('active'); });
    if(state.tab === 'entrainements') renderEntrainements();
    else if(state.tab === 'exercices') renderExercices();
    else if(state.tab === 'historique') renderHistorique();
    else if(state.tab === 'mensurations') renderMensurations();
    else if(state.tab === 'reglages') renderReglages();
    else if(state.tab === 'seance') renderSeance();
    else if(state.tab === 'exo-detail') renderExoDetail();
    else if(state.tab === 'coach') renderCoach();
  }

  function updateTimerDisplay() { $('#timer-display').textContent = pad(Math.floor(timerSec/3600)) + ':' + pad(Math.floor((timerSec%3600)/60)) + ':' + pad(timerSec%60); }
  function toggleTimer() {
    haptic();
    if(timerRunning) { clearInterval(timerInt); $('#timer-btn').textContent = 'Start'; $('#timer-btn').classList.remove('timer-active'); }
    else { timerInt = setInterval(() => { timerSec++; updateTimerDisplay(); }, 1000); $('#timer-btn').textContent = 'Stop'; $('#timer-btn').classList.add('timer-active'); }
    timerRunning = !timerRunning;
  }

  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-act]');
    if(!t) return;
    haptic();
    var act = t.dataset.act;

    if(act === 'tab'){ state.tab = t.dataset.tab; if (state.tab !== 'exo-detail') $('#timer-bar').hidden = true; renderAll(); window.scrollTo(0,0); }
    else if(act === 'open-modal'){ $('#modal-add-exo').hidden = false; $('#search-exo').value = ''; renderModalExercises(''); }
    else if(act === 'close-modal'){ $('#modal-add-exo').hidden = true; }
    else if(act === 'add-exo-modal'){
      state.currentSession.exercises.push({name: t.dataset.name, sets: [{reps:10, kg:0, done:false}, {reps:10, kg:0, done:false}]});
      saveCurrentSession(); $('#modal-add-exo').hidden = true; renderSeance();
    }
    else if(act === 'start-tpl'){
      var tpl = state.templates.find(x => x.id === t.dataset.id);
      if(!tpl) return;
      var ns = { id: uid8(), date: todayStr(), title: tpl.title, exercises: [] };
      tpl.exercises.forEach(function(exName){
        var h = state.sessions.flatMap(s => s.exercises).filter(e => e.name === exName)[0];
        var sets = [{reps: h?.sets[0]?.reps || 10, kg: h?.sets[0]?.kg || 0, done:false}, {reps: h?.sets[1]?.reps || 10, kg: h?.sets[1]?.kg || 0, done:false}];
        ns.exercises.push({name: exName, sets: sets});
      });
      state.currentSession = ns; saveCurrentSession(); state.tab = 'seance'; renderAll();
    }
    else if(act === 'open-exo'){ state.currentExoIdx = parseInt(t.dataset.index); state.tab = 'exo-detail'; renderAll(); }
    else if(act === 'back-to-session'){ state.currentExoIdx = null; $('#timer-bar').hidden = true; saveCurrentSession(); state.tab = 'seance'; renderAll(); }
    else if(act === 'add-set'){ var ex = state.currentSession.exercises[state.currentExoIdx]; ex.sets.push({reps: ex.sets[ex.sets.length-1]?.reps || 10, kg: ex.sets[ex.sets.length-1]?.kg || 0, done:false}); saveCurrentSession(); renderExoDetail(); }
    else if(act === 'toggle-set'){ var setIdx = parseInt(t.dataset.setIndex); var ex = state.currentSession.exercises[state.currentExoIdx]; ex.sets[setIdx].done = !ex.sets[setIdx].done; saveCurrentSession(); renderExoDetail(); if (ex.sets[setIdx].done && !timerRunning) toggleTimer(); }
    else if(act === 'finish-session'){ saveCurrentSession(); state.currentSession = null; state.currentExoIdx = null; state.tab = 'entrainements'; renderAll(); }
    else if(act === 'view-day'){ var id = t.dataset.id; if(!id) return; var s = state.sessions.find(x => x.id === id); if (s) { state.currentSession = JSON.parse(JSON.stringify(s)); state.tab = 'seance'; renderAll(); } }
    else if(act === 'cal-prev'){ calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; } renderHistorique(); }
    else if(act === 'cal-next'){ calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; } renderHistorique(); }
    else if(act === 'timer-show'){ $('#timer-bar').hidden = false; }
    else if(act === 'timer-toggle'){ toggleTimer(); }
    else if(act === 'timer-reset'){ clearInterval(timerInt); timerRunning = false; timerSec = 0; updateTimerDisplay(); $('#timer-btn').textContent = 'Start'; $('#timer-btn').classList.remove('timer-active'); }
    else if(act === 'send-chat'){
      var inp = $('#chat-in'); if(!inp || !inp.value.trim()) return;
      var q = inp.value.trim(); inp.value = '';
      state.chat.push({ role: 'user', text: q }); renderCoach();
      getSample().then(sample => {
        return sample("Contexte muscu. Question: " + q, { onText: function(res) { $('#chatlist').innerHTML = state.chat.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join('') + `<div class="msg bot">${esc(res.text)}</div>`; } });
      }).then(res => { state.chat.push({ role: 'bot', text: res.text }); renderCoach(); });
    }
  });

  document.addEventListener('input', function(ev){
    var t = ev.target;
    if (t.id === 'search-exo') renderModalExercises(t.value);
    if (t.dataset && t.dataset.field && state.currentSession && state.currentExoIdx !== null) {
      var ex = state.currentSession.exercises[state.currentExoIdx];
      var s = ex.sets[parseInt(t.dataset.setIndex)];
      if (t.dataset.field === 'reps') s.reps = parseInt(t.value) || null;
      if (t.dataset.field === 'kg') s.kg = parseFloat(t.value.replace(',','.')) || null;
      saveCurrentSession(); // Sauvegarde instantanée à chaque frappe
    }
  });

  initStore();
})();
</script>
</body></html>
