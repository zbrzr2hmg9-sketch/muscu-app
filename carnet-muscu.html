  function e1rm(s){return s.kg>0&&s.reps>0?(s.reps===1?s.kg:s.kg*(1+s.reps/30)):0}
  function sessVol(s){var v=0;(s.exercises||[]).forEach(function(e){e.sets.forEach(function(x){v+=(x.reps||0)*(x.kg||0)})});return v}
  function setCount(s){var n=0;(s.exercises||[]).forEach(function(e){n+=e.sets.length});return n}
  function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}

  function allSessions(){
    var m=new Map();state.sessions.forEach(function(s){m.set(s.id,s)});
    if(state.cur&&state.cur.exercises.length)m.set(state.cur.id,state.cur);
    return Array.from(m.values()).filter(function(s){return (s.exercises||[]).length}).sort(byDateDesc);
  }
  function history(name,excludeId){
    var key=normKey(name),out=[];
    allSessions().forEach(function(s){
      if(s.id===excludeId)return;
      var ex=s.exercises.find(function(e){return normKey(e.name)===key});
      if(ex&&ex.sets.length)out.push({s:s,ex:ex});
    });
    return out;
  }
  function nameList(){
    if(_nameListCache)return _nameListCache;
    var count=new Map(),first=new Map();
    allSessions().forEach(function(s){s.exercises.forEach(function(e){var k=normKey(e.name);count.set(k,(count.get(k)||0)+1);if(!first.has(k))first.set(k,e.name)})});
    var used=Array.from(count.keys()).sort(function(a,b){return count.get(b)-count.get(a)}).map(function(k){return first.get(k)});
    DEFAULTS.forEach(function(n){if(!count.has(normKey(n)))used.push(n)});
    return _nameListCache=used;
  }
  function defaultSet(name,ex){
    if(ex&&ex.sets.length){var l=ex.sets[ex.sets.length-1];return cp(l)}
    var h=history(name,state.cur.id)[0];
    if(h){var i=(ex?ex.sets.length:0),src=h.ex.sets[Math.min(i,h.ex.sets.length-1)];return cp(src)}
    return {reps:null,kg:null};
  }
  function isPR(name,set){
    if(!(set.reps>0))return false;
    var h=history(name,state.cur.id);if(!h.length)return false;
    var bw=!(set.kg>0),best=0;
    h.forEach(function(x){x.ex.sets.forEach(function(s){
      if(!(s.reps>0))return;
      if(bw){if(!(s.kg>0))best=Math.max(best,s.reps)}else if(s.kg>0)best=Math.max(best,e1rm(s));
    })});
    if(!best)return false;
    return bw?set.reps>best:e1rm(set)>best+0.05;
  }
  function deltaVsLast(name,set,setIdx){
    if(!(set.reps>0))return null;
    var h=history(name,state.cur.id)[0];
    if(!h||!h.ex.sets.length)return null;
    var prev=h.ex.sets[Math.min(setIdx,h.ex.sets.length-1)];
    if(!prev||!(prev.reps>0))return null;
    var bw=!(set.kg>0);
    if(bw&&!(prev.kg>0)){if(set.reps>prev.reps)return '+'+Math.round(set.reps-prev.reps)+' rep'+(set.reps-prev.reps>1?'s':'');return null}
    if(!bw&&prev.kg>0){
      if(set.kg>prev.kg)return '+'+num(set.kg-prev.kg)+' kg';
      if(set.kg===prev.kg&&set.reps>prev.reps)return '+'+Math.round(set.reps-prev.reps)+' rep'+(set.reps-prev.reps>1?'s':'');
    }
    return null;
  }
  /* === Stagnation === */
  function isStagnant(name){
    var h=history(name,state.cur.id);
    if(h.length<4)return false;
    var last4=h.slice(0,4);
    var sig=null;
    for(var i=0;i<last4.length;i++){
      var best=0;
      last4[i].ex.sets.forEach(function(s){var v=s.kg>0?e1rm(s):(s.reps||0);if(v>best)best=v});
      var s=Math.round(best*10)/10;
      if(sig===null)sig=s;else if(Math.abs(s-sig)>0.05)return false;
    }
    return true;
  }

  async function getSample(){
    return async function(prompt, options){
      const res = await fetch('/api/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      if (!res.ok) { const err = await res.text(); throw new Error(err || ('Erreur API ' + res.status)); }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '', buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n'); buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
            if (delta) { fullText += delta; if (options && options.onText) options.onText({ text: fullText }); }
          } catch (e) {}
        }
      }
      return { text: fullText };
    };
  }

  function buildGmap(){

  function groupsFor(name,gmap){
    var k=normKey(name);if(gmap[k])return gmap[k];
    for(var i=0;i<HEUR.length;i++){if(HEUR[i][0].test(name))return {g:[HEUR[i][1]],g2:[]}}
    return {g:['Autre'],g2:[]};
  }
  var HEUR=[
    [/leg curl|ischio|roumain|soulev[ée] de terre|good.?morning/i,'Ischio-jambiers'],
    [/hip thrust|fessier/i,'Fessiers'],
    [/squat|presse|fentes|leg ext|hack|extension des jambes/i,'Quadriceps'],
    [/mollet/i,'Mollets'],
    [/abdo|crunch|gainage|relev[ée] de jambes|relev[ée] du buste/i,'Abdominaux'],
    [/curl|biceps/i,'Biceps'],
    [/triceps|jm press|barre au front|dips|kickback|extension/i,'Triceps'],
    [/[ée]l[ée]vation lat|militaire|d[ée]velopp[ée] (devant|avec halt[eè]res, assis|[ée]paules)|oiseau|tirage au visage|face pull/i,'Épaules'],

  function weekRange(off){

  function currentWeekStats(){

  function updatePR(){

  function renderSeance(focusSel){

  /* === Import === */
  function csvParse(txt){
    var rows=[],row=[],f='',q=false,i=0,n=txt.length;
    if(txt.charCodeAt(0)===0xFEFF)i=1;
    for(;i<n;i++){
      var ch=txt[i];
      if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
      else if(ch==='"')q=true;
      else if(ch===','){row.push(f);f=''}
      else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
      else f+=ch;
    }
    if(f!==''||row.length){row.push(f);rows.push(row)}
    return rows;
  }
  function pnum(s){var m=String(s||'').replace(/[\s  ]/g,'').match(/-?\d+(?:[.,]\d+)?/);return m?Number(m[0].replace(',','.')):null}
  function normG(s){
    var out=[];
    var GN={'Extenseurs des bras':'Triceps','Fléchisseurs des bras':'Biceps','Muscles dorsaux':'Dos','Muscles lombaires':'Lombaires','Extenseurs des poignets':'Avant-bras','Fléchisseurs des poignets':'Avant-bras'};
    String(s||'').replace(/ /g,' ').split(',').forEach(function(x){x=x.trim();if(!x)return;x=GN[x]||x;if(out.indexOf(x)<0)out.push(x)});
    return out;
  }
  function buildImport(rows){
    var h=(rows[0]||[]).map(function(x){return String(x).trim().normalize('NFC')});
    function col(pred){for(var k=0;k<h.length;k++){if(pred(h[k]))return k}return -1}
    var ix={date:col(function(x){return x==='Date'}),title:col(function(x){return x.indexOf('Entra')===0}),time:col(function(x){return x==='Heure'}),ex:col(function(x){return x==='Exercice'}),type:col(function(x){return x.indexOf('chauffement')>=0}),rep:col(function(x){return x.indexOf('pétitions')>=0}),w:col(function(x){return x.indexOf('Poids')===0}),skip:col(function(x){return x.indexOf('Saut')===0}),prim:col(function(x){return x.indexOf('Primaires')>=0}),sec:col(function(x){return x.indexOf('Secondaires')>=0}),note:col(function(x){return x==='Notes'})};
    if(ix.date<0||ix.ex<0||ix.type<0||ix.rep<0||ix.w<0||ix.skip<0)return {error:'Format non reconnu. Choisissez un export CSV de GymBook.'};
    var map=new Map(),st={skipped:0,warm:0,empty:0,sets:0},days=new Set();
    for(var r=1;r<rows.length;r++){
      var row=rows[r];if(row.length<h.length-1)continue;
      if(String(row[ix.skip]).trim()==='Oui'){st.skipped++;continue}
      if(String(row[ix.type]).indexOf('chauffement')>=0){st.warm++;continue}
      var dm=String(row[ix.date]).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!dm)continue;
      var iso=dm[3]+'-'+pad(dm[2])+'-'+pad(dm[1]);
      var title=ix.title>=0?String(row[ix.title]).trim():'',name=String(row[ix.ex]).trim();
      if(!name)continue;
      var repTxt=String(row[ix.rep]),wTxt=String(row[ix.w]),v=pnum(repTxt),set={reps:null,kg:null};
      if(/minute/i.test(repTxt))set.t=Math.round((v||0)*60);
      else if(/seconde/i.test(repTxt))set.t=Math.round(v||0);
      else set.reps=v==null?null:Math.round(v);
      var wv=pnum(wTxt);
      if(/km/i.test(wTxt)){if(wv)set.km=wv}else if(wv!=null)set.kg=wv;
      var nt=ix.note>=0?String(row[ix.note]||'').trim():'';
      if(nt)set.n=nt.slice(0,80);
      if(!(set.reps>0||set.t>0||set.km>0)){st.empty++;continue}
      var key=iso+'|'+title,s=map.get(key);
      if(!s){s={id:'imp-'+iso.replace(/-/g,'')+'-'+(slug(title)||'seance'),date:iso,title:title,exercises:[],note:'',updatedAt:0,_x:new Map()};map.set(key,s)}
      var kx=normKey(name),ex=s._x.get(kx);
      if(!ex){
        ex={id:uid8(),name:name,sets:[]};
        var gp=ix.prim>=0?normG(row[ix.prim]):[];if(gp.length)ex.g=gp;
        var gs=ix.sec>=0?normG(row[ix.sec]):[];if(gs.length)ex.g2=gs;
        s._x.set(kx,ex);s.exercises.push(ex);
      }
      ex.sets.push(set);st.sets++;days.add(iso);
      var tm=String(row[ix.time]||'').match(/(\d{1,2}):(\d{2})/);
      var stamp=parseDate(iso).getTime()+(tm?(Number(tm[1])*60+Number(tm[2]))*60000:0);
      if(stamp>s.updatedAt)s.updatedAt=stamp;
    }
    var byDate={},drop=[];
    map.forEach(function(s){(byDate[s.date]=byDate[s.date]||[]).push(s)});
    Object.keys(byDate).forEach(function(d){
      var L=byDate[d],titled=L.filter(function(s){return s.title}),blank=L.filter(function(s){return !s.title});
      if(titled.length===1&&blank.length){
        var T=titled[0];
        blank.forEach(function(b){
          b.exercises.forEach(function(e){
            var f=T.exercises.filter(function(x){return normKey(x.name)===normKey(e.name)})[0];
            if(f)f.sets=f.sets.concat(e.sets);else T.exercises.push(e);
          });
          if(b.updatedAt>T.updatedAt)T.updatedAt=b.updatedAt;
          drop.push(b.id);
        });
      }
    });
    var out=[],seen={};
    map.forEach(function(s){delete s._x;var id=s.id,n=2;while(seen[id])id=s.id+'-'+(n++);seen[id]=1;s.id=id;out.push(s)});
    var ds=Array.from(days).sort();
    st.sessions=out.length;st.days=days.size;st.first=ds[0];st.last=ds[ds.length-1];
    return {sessions:out,stats:st,drop:drop};
  }
  async function handleImpFile(file){
    if(!file)return;
    state.imp={reading:true};renderHisto();
    try{
      var buf=new Uint8Array(await file.arrayBuffer()),enc='utf-8';
      if(buf[0]===0xFF&&buf[1]===0xFE)enc='utf-16le';else if(buf[0]===0xFE&&buf[1]===0xFF)enc='utf-16be';
      var res=buildImport(csvParse(new TextDecoder(enc).decode(buf)));
      if(res.error)state.imp={error:res.error};
      else if(!res.sessions.length)state.imp={error:'Aucune série effectuée trouvée dans ce fichier.'};
      else state.imp={sessions:res.sessions,stats:res.stats,drop:res.drop};
    }catch(e){state.imp={error:'Lecture du fichier impossible.'}}
    renderHisto();
  }
  async function runImport(){
    var m=state.imp;if(!m||m.busy)return;
    m.busy=true;m.done=0;m.failed=0;state.importing=true;renderHisto();
    var list=m.sessions,idx=0,total=list.length;
    function prog(){var el=$('#impstat');if(el)el.textContent='Import en cours : '+(m.done+m.failed)+' / '+total+' séances'}
    async function writeOne(s){
      var i=state.sessions.findIndex(function(x){return x.id===s.id});
      if(i>=0)state.sessions[i]=s;else state.sessions.push(s);
      return true;
    }
    async function worker(){while(idx<total){var s=list[idx++];var ok=await writeOne(clone(s));if(ok)m.done++;else m.failed++;prog()}}
    await Promise.all([worker(),worker(),worker()]);
    var dr=m.drop||[];
    for(var di=0;di<dr.length;di++){state.sessions=state.sessions.filter(function(x){return x.id!==dr[di]})}
    localSave();invalidateCaches();m.busy=false;m.finished=true;state.importing=false;
    renderHisto();
  }

  function impHTML(){

  function renderHisto(){
    var el=$('#v-histo'),list=allSessions();
    var cutoff=Date.now()-30*864e5,wk=Date.now()-7*864e5;
    var recent=list.filter(function(s){return parseDate(s.date).getTime()>=cutoff});
    var vol7=list.filter(function(s){return parseDate(s.date).getTime()>=wk}).reduce(function(a,s){return a+sessVol(s)},0);
    var head='<header class="head"><h1>Historique</h1><p class="sum">'+(list.length?num(list.length,0)+(list.length>1?' séances':' séance'):'Aucune séance')+'</p></header>';

  /* === Progression === */
  function niceStep(r){var p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
  function renderProg(){
    var el=$('#v-prog'),list=allSessions().slice().reverse();
    var head='<header class="head"><h1>Progression</h1><p class="sum">Meilleure série de chaque séance</p></header>';
    var counts=new Map(),names=new Map();
    list.forEach(function(s){s.exercises.forEach(function(e){var k=normKey(e.name);counts.set(k,(counts.get(k)||0)+1);names.set(k,e.name)})});
    if(!counts.size){el.innerHTML=head+'<div class="empty"><strong>Pas encore de courbe</strong>Enregistrez quelques séances.</div>';return}
    var keys=Array.from(counts.keys()).sort(function(a,b){return counts.get(b)-counts.get(a)});
    if(!state.chartEx||!counts.has(state.chartEx))state.chartEx=keys[0];
    var key=state.chartEx,pts=[];
    list.forEach(function(s){
      var ex=s.exercises.find(function(e){return normKey(e.name)===key});
      if(ex&&ex.sets.length)pts.push({date:s.date,sets:ex.sets});
    });
    var kgCount=pts.filter(function(p){return p.sets.some(function(x){return x.kg>0&&x.reps>0})}).length;
    var useKg=kgCount>0&&kgCount*2>=pts.length;
    var mode=state.chartMode;
    var unit=useKg?'kg':(pts.some(function(p){return p.sets.some(function(x){return x.reps>0})})?'reps':'min');
    function mv(x){return mode==='volume'?(x.reps||0)*(x.kg||0):(useKg?e1rm(x):(x.reps||0))}
    pts.forEach(function(p){var b=0,bs=null;p.sets.forEach(function(x){var v=mv(x);if(v>b){b=v;bs=x}});p.v=b;p.best=bs});
    var opts=keys.map(function(k){return '<option value="'+esc(k)+'"'+(k===key?' selected':'')+'>'+esc(names.get(k))+' ('+counts.get(k)+')</option>'}).join('');
    var modeSel='<div class="chips" style="margin-top:0;margin-bottom:12px"><button type="button" class="chip'+(mode==='charge'?' next':'')+'" data-act="chart-mode" data-mode="charge">Charge</button><button type="button" class="chip'+(mode==='volume'?' next':'')+'" data-act="chart-mode" data-mode="volume">Volume</button></div>';
    var vs=pts.map(function(p){return p.v}),lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
    var step=niceStep(((hi-lo)||Math.max(hi,1)*0.2)/3);
    var y0=Math.floor(lo/step)*step,y1=Math.ceil(hi/step)*step;if(y1===y0)y1=y0+step;
    var W=360,H=220,L=42,R=16,T=18,B=28,pw=W-L-R,ph=H-T-B;
    var t0=parseDate(pts[0].date).getTime(),t1=parseDate(pts[pts.length-1].date).getTime();
    function X(p){return t1===t0?L+pw/2:L+(parseDate(p.date).getTime()-t0)/(t1-t0)*pw}
    function Y(v){return T+ph-(v-y0)/(y1-y0)*ph}
    var grid='',tick=y0;
    for(var n=0;tick<=y1+step/1000&&n<8;n++,tick+=step){grid+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(tick)+'" y2="'+Y(tick)+'"/><text x="'+(L-6)+'" y="'+(Y(tick)+4)+'" text-anchor="end">'+num(tick,1)+'</text>'}
    var path=pts.map(function(p,i){return (i?'L':'M')+X(p).toFixed(1)+' '+Y(p.v).toFixed(1)}).join('');
    var dots=pts.map(function(p,i){return '<circle class="pt'+(i===pts.length-1?' last':'')+'" cx="'+X(p).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(i===pts.length-1?5:4)+'"/>'}).join('');
    var svg='<svg viewBox="0 0 '+W+' '+H+'">'+grid+(pts.length>1?'<path class="line" d="'+path+'"/>':'')+dots+'</svg>';
    var rows=pts.slice().reverse().slice(0,8).map(function(p){return '<li><span>'+esc(fmtShort(p.date))+'</span><span>'+p.sets.map(fmtSet).join(' · ')+'</span></li>'}).join('');
    el.innerHTML=head+'<label class="lbl">Exercice</label><select id="exsel">'+opts+'</select>'+modeSel+
      '<div class="chart">'+svg+'</div>'+
      '<button type="button" class="btn" data-act="open-exo" data-name="'+esc(names.get(key))+'">Voir toutes les séances de cet exercice</button>'+
      '<div id="bicepbox"></div>'+
      '<ul class="plist">'+rows+'</ul>';
    renderBicep();
  }

  /* === Bilan === */
  var DAYS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  function rirOf(n){
    var s=String(n),m;
    if(/[ée]chec/i.test(s)&&!/rir|rpe/i.test(s))return {lo:0,hi:0};
    m=s.match(/rpe\s*:?\s*(\d+(?:[.,]\d+)?)/i);
    if(m){var v=Math.max(10-Number(m[1].replace(',','.')),0);return {lo:v,hi:v}}
    m=s.match(/(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*\??\s*rir/i)||s.match(/rir\s*:?\s*(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?/i);
    if(!m&&/^\s*\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?\s*$/.test(s))m=s.match(/(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?/);
    if(!m)return null;
    var lo=Number(m[1].replace(',','.')),hi=m[2]?Number(m[2].replace(',','.')):lo;
    return {lo:Math.min(lo,hi),hi:Math.max(lo,hi)};
  }
  function weekStats(list,gmap){
    var st={seances:list.length,series:0,volume:0,groupes:{},annotees:0,echec:0,rirSum:0};
    list.forEach(function(s){
      st.volume+=sessVol(s);
      s.exercises.forEach(function(e){
        var gg=groupsFor(e.name,gmap);
        e.sets.forEach(function(x){
          st.series++;
          gg.g.forEach(function(g){var o=st.groupes[g]||(st.groupes[g]={directes:0,indirectes:0});o.directes++});
          gg.g2.forEach(function(g){var o=st.groupes[g]||(st.groupes[g]={directes:0,indirectes:0});o.indirectes++});
          if(x.n){var r=rirOf(x.n);if(r){st.annotees++;if(r.hi<=0)st.echec++;st.rirSum+=(r.lo+r.hi)/2}}
        });
      });
    });
    return st;
  }
  function startTitles(){
    var c={},f={};
    allSessions().forEach(function(s){var t=(s.title||'').trim();if(!t)return;var k=normKey(t);c[k]=(c[k]||0)+1;f[k]=t});
    return Object.keys(c).sort(function(a,b){return c[b]-c[a]}).map(function(k){return f[k]});
  }
  function resolveTitle(){
    var ts=startTitles(),cur=normKey(state.cycTitle);
    if(cur&&ts.some(function(t){return normKey(t)===cur}))return state.cycTitle;
    var pa=ts.filter(function(t){return /^pull a$/i.test(t)})[0];
    return pa||ts[0]||'';
  }
  function cycles(){
    var key=normKey(resolveTitle());
    var asc=allSessions().slice().sort(function(a,b){return a.date.localeCompare(b.date)||(a.updatedAt||0)-(b.updatedAt||0)});
    var out=[],cur=null,prev=null;
    asc.forEach(function(s){
      var t=normKey(s.title);
      var gap=prev?Math.round((parseDate(s.date)-parseDate(prev.date))/864e5):0;
      var again=key&&t===key&&cur&&cur.list.some(function(x){return normKey(x.title)===key});
      if(!cur||again||gap>=8||cur.list.length>=7){cur={list:[]};out.push(cur)}
      cur.list.push(s);prev=s;
    });
    return out.reverse().map(function(c){var l=c.list.slice().reverse();return {start:l[l.length-1].date,end:l[0].date,list:l}});
  }
  function getPeriod(off){
    if(state.wkMode==='cycle'){
      var cs=cycles(),c=cs[off];
      if(!c)return {start:'',end:'',list:[]};

  function bestByEx(list){

      var k=normKey(e.name);

      e.sets.forEach(function(x){var v=x.kg>0?e1rm(x):0;if(v>b)b=v});
      if(b>(m[k]?m[k].best:0))m[k]={name:e.name,best:b,bestSet:e.sets.reduce(function(a,x){return e1rm(x)>e1rm(a)?x:a},e.sets[0])};
    })});
    return m;
  }
  function cmpTable(curList,prevList){

      modeSel+sub+

  async function analyzeWeek(){

    if(!p.list.length||(state.wana.busy&&state.wana.ws===key))return;
    if(wkAbort)wkAbort.abort();wkAbort=new AbortController();var signal=wkAbort.signal;
    var a=state.wana={ws:key,busy:true,error:null,live:null};showWana(true);
    var here=function(){return state.tab==='bilan'&&state.wkOff===off0&&state.wkMode===mode0};
    try{
      var sample=await getSample();
      var res=await sample(wkPrompt(p),{onText:function(t){if(signal.aborted)return;a.live=t.text;if(here()){var el=$('#wanatxt');if(el)el.textContent=t.text}}});
      if(signal.aborted)return;
      a.busy=false;a.live=null;
      var text=String(res&&res.text||'').trim();
      if(text){var doc={id:key,kind:'week',date:p.start,mode:mode0,analysis:{text:text,at:Date.now()}};state.weeks[key]=doc;try{localStorage.setItem('carnet-muscu.weeks',JSON.stringify(state.weeks))}catch(e){}}
      else a.error="L'analyse est vide. Réessayez.";
      if(here())renderBilan();
    }catch(e){
      if(signal.aborted)return;
      a.busy=false;a.live=null;a.error="L'analyse a échoué. "+((e&&e.message)||'');
      if(here())showWana();
    }
  }

  /* === Coach === */
  function coachContext(){
    var c=state.cur;
    var recent=allSessions().filter(function(s){return s.id!==c.id}).slice(0,8).map(function(s){return {date:s.date,titre:s.title||'',exercices:s.exercises.map(function(e){return {nom:e.name,series:e.sets.map(fmtSetN)}})}});
    return {date_du_jour:todayStr(),seance_en_cours:{date:c.date,titre:c.title||'',notes:c.note||'',exercices:c.exercises.map(function(e){return {nom:e.name,series:e.sets.map(fmtSetN)}})},historique_recent:recent,programmes:state.tpls.map(function(t){return {nom:t.title,exercices:t.exercises.map(function(e){return e.name+' ×'+e.sets})}}),recuperation:state.readiness?{score:state.readiness.score}:null,tour_de_bras:state.bicep&&state.bicep.length?state.bicep[state.bicep.length-1]:null};
  }
  function coachSystem(){
    return ["Tu es un coach de musculation expérimenté qui répond en français, de façon directe et concrète.","Contexte athlète : objectif prise de masse, priorité au tour de bras. Pectoraux = point fort. Double progression, souvent proche de l'échec.","Règles : appuie-toi UNIQUEMENT sur les données JSON fournies. Si une donnée manque, dis-le. Réponds en texte brut, sans markdown, 120 mots max. Douleur → conseille d'adapter et de consulter si persiste.","","Données (JSON) :",JSON.stringify(coachContext())].join("\n");
  }
  function coachSuggestions(){
    var out=[],c=state.cur;
    if(c.exercises.length)out.push("Comment était ma séance ?");
    out.push("Suis-je en surcharge progressive sur le squat ?");
    out.push("Propose-moi une séance Push");
    out.push("Comment progresser au développé couché ?");
    return out.slice(0,4);
  }
  function renderCoach(focusInput){
    var el=$('#v-coach');if(!el)return;
    var c=state.cur;if(!c.chat)c.chat=[];
    var msgs=c.chat.map(function(m){
      var cls=m.role==='user'?'user':'bot';
      return '<div class="msg '+cls+'"><div class="msgbody">'+esc(m.text)+'</div><span class="msgtime">'+new Date(m.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</span></div>';
    }).join('');
    var a=state.coach;
    if(a.busy)msgs+='<div class="msg bot"><div class="msgbody">'+esc(a.live||'…')+'</div></div>';
    if(a.error)msgs+='<div class="msg bot" style="border-color:var(--danger)"><div class="msgbody">'+esc(a.error)+'</div></div>';
    var empty=!c.chat.length&&!a.busy?'<div class="chat-empty"><strong>Votre coach</strong>Posez une question.</div>':'';
    var sugg=coachSuggestions().map(function(s){return '<button type="button" class="chip" data-act="coach-ask" data-q="'+esc(s)+'">'+esc(s)+'</button>'}).join('');
    el.innerHTML='<header class="head"><h1>Coach</h1><p class="sum">'+(c.title?esc(c.title)+' · ':'')+(c.exercises.length?'séance en cours':'aucune séance')+'</p></header>'+empty+'<div class="chat" id="chatlist" role="log">'+msgs+'</div>'+(a.busy?'':'<div class="chips sugg">'+sugg+'</div>')+'<div class="chatbar"><textarea id="coachq" rows="2" placeholder="Votre question…"'+(a.busy?' disabled':'')+'></textarea><div class="row">'+(a.busy?'<button type="button" class="btn" data-act="coach-stop">Arrêter</button>':'<button type="button" class="btn primary" data-act="coach-send">Envoyer</button>')+'</div></div>';
    var list=$('#chatlist');if(list)list.scrollTop=list.scrollHeight;
    if(focusInput){var f=$('#coachq');if(f)f.focus({preventScroll:true})}
  }
  async function coachSend(q){
    q=(q||'').trim();if(!q||state.coach.busy)return;
    var c=state.cur;if(!c.chat)c.chat=[];
    c.chat.push({role:'user',text:q,at:Date.now()});markDirty();renderCoach();
    var a=state.coach={busy:true,error:null,live:null};
    if(coachAbort)coachAbort.abort();coachAbort=new AbortController();var signal=coachAbort.signal;
    try{
      var hist=c.chat.slice(-10).map(function(m){return (m.role==='user'?'Utilisateur : ':'Coach : ')+m.text}).join('\n\n');
      var prompt=coachSystem()+'\n\n--- Conversation ---\n'+hist+'\n\nRéponds au dernier message.';
      var sample=await getSample();
      var res=await sample(prompt,{onText:function(t){if(signal.aborted)return;a.live=t.text;var el=document.querySelector('.msg.bot .msgbody');if(el&&state.coach===a)el.textContent=t.text}});
      if(signal.aborted)return;
      a.busy=false;a.live=null;
      var text=String(res&&res.text||'').trim();
      if(text){c.chat.push({role:'assistant',text:text,at:Date.now()});markDirty()}
      else a.error="Réponse vide.";
      renderCoach();
    }catch(e){
      if(signal.aborted)return;
      a.busy=false;a.live=null;a.error="Le coach a échoué. "+((e&&e.message)||'');
      renderCoach();
    }
  }
  function coachStop(){if(coachAbort)coachAbort.abort();state.coach.busy=false;state.coach.live=null;renderCoach()}

  /* === Timer === */
  function startTimer(sec){
    stopTimer();
    timerEnd=Date.now()+sec*1000;
    $('#timer').hidden=false;
    tickTimer();
    timerInt=setInterval(tickTimer,250);
  }
  function tickTimer(){
    var rem=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));
    var m=Math.floor(rem/60),s=rem%60;
    $('#timertxt').textContent=m+':'+pad(s);
    if(rem<=0){stopTimer();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  }
  function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null};$('#timer').hidden=true}

  /* === Dictée === */
  function toggleMic(){
    if(micRec){micRec.stop();micRec=null;$('#micbtn').classList.remove('rec');return}
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('La dictée n\'est pas disponible sur ce navigateur.');return}
    micRec=new SR();micRec.lang='fr-FR';micRec.interimResults=true;
    micRec.onresult=function(ev){
      var txt='';for(var i=0;i<ev.results.length;i++)txt+=ev.results[i][0].transcript;
      var ta=$('#snote');if(ta){ta.value=(ta.value?ta.value+' ':'')+txt;state.cur.note=ta.value;markDirty()}
    };
    micRec.onend=function(){micRec=null;$('#micbtn').classList.remove('rec')};
    micRec.start();$('#micbtn').classList.add('rec');
  }

  /* === Navigation === */
  function renderAll(){
    ['seance','histo','prog','bilan','coach','exo','focus','ready'].forEach(function(t){$('#v-'+t).hidden=state.tab!==t});
    document.querySelectorAll('nav button').forEach(function(b){
      if(b.dataset.tab===state.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
    });
    if(state.tab==='seance')renderSeance();
    else if(state.tab==='histo')renderHisto();
    else if(state.tab==='bilan')renderBilan();
    else if(state.tab==='coach')renderCoach();
    else if(state.tab==='exo')renderExo();
    else if(state.tab==='focus')renderFocus();
    else if(state.tab==='ready')renderReady();
    else renderProg();
  }
  function setConfirm(v){
    state.confirm=v;clearTimeout(confirmTimer);
    if(v)confirmTimer=setTimeout(function(){state.confirm=null;if(state.tab==='seance')renderSeance()},4000);
  }

  /* === Actions === */
  function addExercise(name){
    name=(name||'').trim();if(!name)return;
    var c=state.cur,found=c.exercises.find(function(e){return normKey(e.name)===normKey(name)});
    if(found){renderSeance('#r-'+found.id+'-0-reps');return}
    var canon=nameList().find(function(n){return normKey(n)===normKey(name)})||name;
    var ex={id:uid8(),name:canon,sets:[]};
    ex.sets.push(defaultSet(canon,null));
    c.exercises.push(ex);markDirty();renderSeance('#r-'+ex.id+'-0-reps');
  }
  function findEx(id){return state.cur.exercises.find(function(e){return e.id===id})}

  document.addEventListener('click',function(ev){
    var t=ev.target.closest('[data-act]');if(!t)return;
    var act=t.dataset.act,c=state.cur;
    if(act==='tab'){state.prevTab=state.tab;state.tab=t.dataset.tab;setConfirm(null);renderAll();window.scrollTo(0,0)}
    else if(act==='add-ex'){addExercise($('#newex').value)}
    else if(act==='quick'){addExercise(t.dataset.name)}
    else if(act==='add-set'){var ex=findEx(t.dataset.ex);if(!ex)return;ex.sets.push(defaultSet(ex.name,ex));markDirty();renderOneExercise(ex.id);var f=$('#r-'+ex.id+'-'+(ex.sets.length-1)+'-reps');if(f){f.focus({preventScroll:true});if(f.select)f.select()}updateSum()}
    else if(act==='del-set'){var row=t.closest('.set'),ex2=findEx(row.dataset.ex);if(!ex2)return;var removed=ex2.sets.splice(Number(row.dataset.i),1)[0];markDirty();renderOneExercise(ex2.id);updateSum();showUndo('Série supprimée',function(){ex2.sets.push(removed);markDirty();renderOneExercise(ex2.id);updateSum()})}
    else if(act==='del-ex'){var id=t.dataset.ex;if(state.confirm==='ex:'+id){setConfirm(null);c.exercises=c.exercises.filter(function(e){return e.id!==id});markDirty()}else setConfirm('ex:'+id);renderSeance()}
    else if(act==='del-session'){if(state.confirm==='sess'){setConfirm(null);var old=c.id;state.cur=newSession();dirty=false;state.saveState='idle';clearTimeout(saveTimer);removeSession(old).then(function(){onSessions()});renderSeance()}else{setConfirm('sess');renderSeance()}}
    else if(act==='new-session'){clearTimeout(saveTimer);if(dirty){var toSave=clone(state.cur);chain=chain.then(function(){return doSaveSnapshot(toSave)}).catch(function(){})}state.cur=newSession();dirty=false;state.saveState='idle';setConfirm(null);state.tab='seance';renderAll();window.scrollTo(0,0)}
    else if(act==='analyze'){analyze()}
    else if(act==='wk-prev'){state.wkOff++;renderBilan()}
    else if(act==='wk-next'){if(state.wkOff>0){state.wkOff--;renderBilan()}}
    else if(act==='wk-analyze'){analyzeWeek()}
    else if(act==='more'){state.histoN+=40;renderHisto()}
    else if(act==='imp-go'){runImport()}
    else if(act==='imp-cancel'){state.imp=null;renderHisto()}
    else if(act==='export-csv'){exportCSV()}
    else if(act==='export-json'){exportJSON()}
    else if(act==='open'){var s=state.sessions.find(function(x){return x.id===t.dataset.id});if(!s)return;clearTimeout(saveTimer);if(dirty){var toSave2=clone(state.cur);chain=chain.then(function(){return doSaveSnapshot(toSave2)}).catch(function(){})}state.cur=clone(s);dirty=false;state.saveState='idle';setConfirm(null);state.tab='seance';renderAll();window.scrollTo(0,0)}
    else if(act==='redo'){var s2=state.sessions.find(function(x){return x.id===t.dataset.id});if(!s2)return;clearTimeout(saveTimer);if(dirty){var toSave3=clone(state.cur);chain=chain.then(function(){return doSaveSnapshot(toSave3)}).catch(function(){})}var ns=newSession();ns.title=s2.title||'';s2.exercises.forEach(function(e){var nex={id:uid8(),name:e.name,sets:prefillSets(e.name,e.sets.length)};ns.exercises.push(nex)});state.cur=ns;dirty=false;state.saveState='idle';setConfirm(null);state.tab='seance';renderAll();window.scrollTo(0,0)}
    else if(act==='open-exo'){state.exoName=t.dataset.name;state.tab='exo';renderAll();window.scrollTo(0,0)}
    else if(act==='chart-mode'){state.chartMode=t.dataset.mode;renderProg()}
    else if(act==='start'){startFrom(t.dataset.id)}
    else if(act==='tpl-save'){tplSaveCur()}
    else if(act==='tpl-del'){var tid=t.dataset.id;if(state.confirm==='tpl:'+tid){setConfirm(null);tplDel(tid);renderProgs()}else{setConfirm('tpl:'+tid);renderProgs()}}
    else if(act==='coach-send'){var q=$('#coachq');if(q)coachSend(q.value)}
    else if(act==='coach-ask'){coachSend(t.dataset.q)}
    else if(act==='coach-stop'){coachStop()}
    else if(act==='timer-start'){startTimer(90)}
    else if(act==='timer-cancel'){stopTimer()}
    else if(act==='focus-exit'){state.tab='seance';renderAll()}
    else if(act==='focus-next'){focusNext()}
    else if(act==='focus-prev'){focusPrev()}
    else if(act==='toggle-lock'){var exl=findEx(t.dataset.ex);if(exl){exl.locked=!exl.locked;markDirty();renderOneExercise(exl.id)}}
    else if(act==='edit-range'){var exr=findEx(t.dataset.ex);if(!exr)return;var rg=rangeFor(exr.name);var lo=prompt('Reps minimum pour '+exr.name,rg[0]);if(lo===null)return;var hi=prompt('Reps maximum pour '+exr.name,rg[1]);if(hi===null)return;setRange(exr.name,Math.max(1,parseInt(lo)||8),Math.max(1,parseInt(hi)||12));renderOneExercise(exr.id)}
    else if(act==='bicep-add'){addBicep()}
    else if(act==='mic'){toggleMic()}
    else if(act==='ready-set'){if(!state.readiness)state.readiness={};var qk=t.dataset.q;var v=Number(t.dataset.v);if(state.readiness[qk]===v){delete state.readiness[qk]}else{state.readiness[qk]=v}computeReadiness()}
    else if(act==='ready-reset'){state.readiness=null;renderReady()}
    else if(act==='undo-apply'){if(state.undo){state.undo();state.undo=null;$('#undo').hidden=true}}
  });

  document.addEventListener('input',function(ev){
    var t=ev.target,c=state.cur;
    if(t.dataset&&t.dataset.focus){
      var i=Math.min(state.focus.ex,c.exercises.length-1),ex=c.exercises[i];
      if(!ex)return;
      var j=Math.min(state.focus.set,Math.max(0,ex.sets.length-1));
      if(!ex.sets[j])ex.sets[j]={reps:null,kg:null};
      var raw=t.value.replace(',','.').trim(),v=raw===''?null:Number(raw);
      if(v!==null&&(isNaN(v)||v<0))return;
      if(t.dataset.focus==='reps')ex.sets[j].reps=v===null?null:Math.round(v);
      else ex.sets[j].kg=v;
      markDirty();
      return;
    }
    if(t.dataset&&t.dataset.field){
      var row=t.closest('.set'),ex=findEx(row.dataset.ex);if(!ex)return;
      var s0=ex.sets[Number(row.dataset.i)];
      if(t.dataset.field==='n'){var nv=t.value.slice(0,80);if(nv.trim())s0.n=nv;else delete s0.n;markDirty();return}
      var raw=t.value.replace(',','.').trim(),v=raw===''?null:Number(raw);
      if(v!==null&&(isNaN(v)||v<0))return;
      if(t.dataset.field==='reps')s0.reps=v===null?null:Math.round(v);else s0.kg=v;
      markDirty();updateSum();updatePR();
    }else if(t.id==='snote'){c.note=t.value;markDirty()}
    else if(t.id==='sname'){c.title=t.value;markDirty();updateSum()}
  });
  document.addEventListener('change',function(ev){
    var t=ev.target;
    if(t.id==='sdate'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){state.cur.date=t.value;$('#stitle').textContent=fmtLong(t.value);markDirty()}
    else if(t.id==='exsel'){state.chartEx=t.value;renderProg()}
    else if(t.id==='impfile'){handleImpFile(t.files&&t.files[0])}
    else if(t.id==='wkmode'){state.wkMode=t.value==='cal'?'cal':'cycle';state.wkOff=0;try{localStorage.setItem('carnet-muscu.wkmode',state.wkMode)}catch(e){}renderBilan()}
    else if(t.id==='cyctitle'){state.cycTitle=t.value;state.wkOff=0;try{localStorage.setItem('carnet-muscu.cyctitle',state.cycTitle)}catch(e){}renderBilan()}
    else if(t.id==='wkstart'){state.wkStart=Number(t.value);state.wkOff=0;try{localStorage.setItem('carnet-muscu.wkstart',String(state.wkStart))}catch(e){}renderBilan()}
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'&&ev.target.id==='newex'){ev.preventDefault();addExercise(ev.target.value)}
    if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.id==='coachq'){ev.preventDefault();coachSend(ev.target.value)}
  });

  if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}

  state.cur=newSession();
  renderAll();
  initStore();
})();
</script>
</body></html>
