<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Entraînements</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --fg:#1C1C1E; --muted:#8E8E93; --rule:#E5E5EA;
  --accent:#20B2AA; --accent-fg:#FFFFFF; --accent-light:#E0F7F6;
  --danger:#FF3B30; --blue:#007AFF;
  --display:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --fg:#FFFFFF; --muted:#8E8E93; --rule:#38383A;
    --accent:#2AC9C0; --accent-light:#1A2E2E;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.4; padding-block:16px 96px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:600px; margin:0 auto}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1{font-family:var(--display); font-weight:800; font-size:32px; margin:0 0 4px 0; letter-spacing:-0.5px}
h2{font-family:var(--display); font-weight:700; font-size:22px; margin:0 0 12px 0}
h3{font-family:var(--display); font-weight:600; font-size:17px; margin:0}
.head{margin-bottom:20px; padding-top:8px}
.head .sub{font-size:15px; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:6px}
.head .line{display:inline-block; width:40px; height:4px; background:var(--accent); border-radius:2px; margin-top:6px}
.card{background:var(--surface); border-radius:16px; overflow:hidden; margin-bottom:16px}
.row{display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--rule); gap:12px}
.row:last-child{border-bottom:0}
.row .r-left{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
.row .r-title{font-weight:600; font-size:17px; color:var(--fg)}
.row .r-sub{font-size:13px; color:var(--muted); font-weight:500}
.row .r-right{display:flex; align-items:center; gap:12px; flex-shrink:0}
.badge-jours{background:#E8E8ED; color:#555; font-size:13px; font-weight:600; padding:4px 10px; border-radius:12px; display:flex; align-items:center; gap:4px}
.badge-jours .check{color:var(--accent); font-size:12px}
.info-btn{background:transparent; border:2px solid var(--accent); color:var(--accent); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; cursor:pointer}
.chevron{color:#C7C7CC; font-size:20px; font-weight:400}
.icon-btn{background:transparent; border:0; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--muted)}
.btn{min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--rule); background:var(--surface); font-weight:600; font-size:15px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent; border-color:transparent; color:var(--accent)}
input[type="text"], input[type="number"], input[type="date"], textarea{width:100%; border:1px solid var(--rule); border-radius:10px; background:var(--bg); padding:12px; font-size:16px; color:var(--fg); outline:none}
input:focus, textarea:focus{border-color:var(--accent)}
.lbl{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px}
nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--rule); z-index:20; padding-bottom:env(safe-area-inset-bottom, 0px); display:flex; justify-content:space-around; height:64px; padding-top:8px}
nav button{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); font-size:10px; font-weight:600; padding:0 8px; flex:1}
nav button svg{width:24px; height:24px; fill:currentColor}
nav button.active{color:var(--accent)}

/* Écran Séance (Pull A) */
.session-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px}
.ex-row{display:flex; align-items:center; padding:16px; border-bottom:1px solid var(--rule); gap:12px; cursor:pointer}
.ex-row:last-child{border-bottom:0}
.ex-illu{width:50px; height:50px; background:#F0F0F5; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:10px; flex-shrink:0}
.ex-info{flex:1; display:flex; flex-direction:column; gap:4px}
.ex-title{font-weight:600; font-size:16px; color:var(--fg)}
.ex-sub{font-size:13px; color:var(--muted)}

/* Écran Exercice (Curl Pupitre) */
.exo-detail-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px}
.exo-detail-title{font-size:32px; font-weight:800; line-height:1.1; letter-spacing:-0.5px; margin-bottom:20px}
.set-history-row{display:flex; align-items:center; padding:12px 0; border-bottom:1px solid var(--rule); gap:16px}
.set-circle{width:32px; height:32px; border-radius:50%; background:#E8E8ED; color:#555; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0}
.set-main{font-size:18px; font-weight:600}
.set-main span{color:var(--muted); font-size:14px; font-weight:500}
.set-history-text{flex:1; text-align:right; color:var(--muted); font-size:13px; line-height:1.6}
.set-history-text u{text-decoration:underline; text-decoration-color:#C7C7CC}
.chart-container{background:var(--surface); border-radius:16px; padding:16px; margin-top:16px}
.chart-svg{width:100%; height:auto; overflow:visible}
.timer-bar{position:fixed; bottom:64px; left:0; right:0; background:var(--surface); border-top:1px solid var(--rule); padding:12px 16px; display:flex; align-items:center; gap:16px; z-index:10}
.timer-display{font-family:monospace; font-size:24px; font-weight:700; color:var(--muted); flex:1; text-align:center}

/* Coach Chat */
.chat-container{display:flex; flex-direction:column; gap:12px; margin-bottom:16px}
.msg{max-width:85%; padding:12px 16px; border-radius:20px; font-size:15px; line-height:1.4}
.msg.user{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start; background:var(--surface); border:1px solid var(--rule); border-bottom-left-radius:4px}
</style>

<div class="wrap">
  <main>
    <section id="v-entrainements" aria-label="Entraînements"></section>
    <section id="v-exercices" aria-label="Exercices" hidden></section>
    <section id="v-historique" aria-label="Historique" hidden></section>
    <section id="v-mensurations" aria-label="Mensurations" hidden></section>

</div>

    Exercices
  </button>
  <button type="button" data-act="tab" data-tab="historique">

  </button>
  <button type="button" data-act="tab" data-tab="reglages">
    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>

<div class="timer-bar" id="timer-bar" hidden>
  <div class="timer-display" id="timer-display">00:00:00</div>

  <button class="icon-btn" data-act="timer-reset" style="font-size:16px">↺</button>
</div>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var LS_KEY='carnet-muscu.v1';
  var state={tab:'entrainements',sessions:[],cur:null,templates:[],metrics:[],loaded:false,currentExo:null,currentSession:null,chat:[]};
  var currentDate = new Date();
  var calMonth = currentDate.getMonth();
  var calYear = currentDate.getFullYear();
  
  var timerInt = null;
  var timerSec = 0;
  var timerRunning = false;

  function uid8(){return Math.random().toString(36).slice(2,10)}
  function pad(n){return String(n).padStart(2,'0')}
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function parseDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
  function fmtShort(s){return parseDate(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}

  function initStore(){
    try{state.sessions=JSON.parse(localStorage.getItem(LS_KEY)||'[]')}catch(e){state.sessions=[]}
    try{state.templates=JSON.parse(lsGet('carnet-muscu.templates','[]'))}catch(e){state.templates=[]}
    
    if(!state.templates.length){
      state.templates = [
        {id:'t1', title:'Pull A', desc:'Pectoraux Dos Bras', exercises:['Curl Pupitre à Un Bras avec Haltère, Debout','Curl à la Barre','Rowing à la Barre, Buste Penché, Prise Inversée','Pull-Over avec Haltère','Curl à la Barre, Prise Inversée','Haussement d\'Épaules à la Barre Hexagonale']},
        {id:'t2', title:'Push A', desc:'Épaules Pectoraux Bras', exercises:['Développé couché','Développé militaire','Dips']},
        {id:'t3', title:'Legs', desc:'Dos Jambes', exercises:['Squat','Soulevé de terre','Presse à cuisses']}
      ];
      saveTemplates();
    }
    state.loaded = true;
    renderAll();
  }
  function saveSessions(){try{localStorage.setItem(LS_KEY,JSON.stringify(state.sessions))}catch(e){}}
  function saveTemplates(){try{localStorage.setItem('carnet-muscu.templates',JSON.stringify(state.templates))}catch(e){}}

  async function getSample(){
    return async function(prompt, options){
      const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
      if (!res.ok) throw new Error('Erreur API');
      const reader = res.body.getReader(), decoder = new TextDecoder();
      let fullText = '', buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n'); buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) { fullText += delta; if (options?.onText) options.onText({ text: fullText }); }
          } catch (e) {}
        }
      }
      return { text: fullText };
    };
  }

  /* --- RENDU : ENTRAINEMENTS (Liste) --- */
  function renderEntrainements(){
    var el = $('#v-entrainements');
    var today = new Date();
    var tplsHtml = state.templates.map(function(t){
      var lastDone = state.sessions.filter(s => s.title === t.title).sort((a,b)=>b.date.localeCompare(a.date))[0];
      var daysAgo = 'Nouveau';
      if(lastDone){
        var diff = Math.floor((today - parseDate(lastDone.date)) / (1000 * 60 * 60 * 24));
        daysAgo = diff === 0 ? "Auj." : diff + " j";
      }
      return `
        <div class="row" data-act="start-tpl" data-id="${t.id}">
          <div class="r-left"><div class="r-title">${esc(t.title)}</div><div class="r-sub">${esc(t.desc)}</div></div>
          <div class="r-right"><div class="badge-jours"><span class="check">✓</span> ${daysAgo}</div><div class="info-btn">i</div><div class="chevron">›</div></div>
        </div>
      `;
    }).join('');

    el.innerHTML = `<div class="head"><h1>Entraînements</h1><div class="line"></div></div><div class="card">${tplsHtml}</div>`;
  }

  /* --- RENDU : EXERCICES --- */
  function renderExercices(){
    $('#v-exercices').innerHTML = `<div class="head"><h1>Exercices</h1><div class="line"></div></div><div class="card" style="padding:16px;text-align:center;color:var(--muted)">Recherche bientôt disponible.</div>`;
  }

  /* --- RENDU : HISTORIQUE --- */
  function renderHistorique(){
    var el = $('#v-historique');
    var monthNames = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
    var firstDay = new Date(calYear, calMonth, 1).getDay();
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    var offset = (firstDay === 0 ? 6 : firstDay - 1);

    var daysHtml = '';
    for (var i = 0; i < offset; i++) daysHtml += '<div></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = calYear + '-' + pad(calMonth+1) + '-' + pad(d);
      var hasWorkout = state.sessions.some(s => s.date === dateStr);
      daysHtml += `<div class="cal-day ${hasWorkout ? 'has-workout' : ''}">${d}</div>`;
    }

    el.innerHTML = `
      <div class="head"><h1>Historique</h1><div class="line"></div></div>
      <div class="card"><div class="row"><div class="r-title">Entraînements</div><div class="chevron">›</div></div></div>
      <div class="cal">
        <div class="cal-head"><button data-act="cal-prev">‹</button><div style="font-weight:700; font-size:18px">${monthNames[calMonth]} ${calYear}</div><button data-act="cal-next">›</button></div>
        <div class="cal-grid"><div class="cal-day-name">L</div><div class="cal-day-name">M</div><div class="cal-day-name">M</div><div class="cal-day-name">J</div><div class="cal-day-name">V</div><div class="cal-day-name">S</div><div class="cal-day-name">D</div>${daysHtml}</div>
      </div>
    `;
  }

  /* --- RENDU : MENSURATIONS --- */
  function renderMensurations(){
    $('#v-mensurations').innerHTML = `
      <div class="head"><h1>Mensurations</h1><div class="line"></div></div>
      <h2 style="font-size:16px; text-transform:uppercase; color:var(--muted); margin-left:8px">Informations de base</h2>
      <div class="card">
        <div class="row"><div class="r-left"><div class="r-title">Poids</div></div><div class="r-right"><div class="r-sub">83,70 kg</div><div class="chevron">›</div></div></div>
        <div class="row"><div class="r-left"><div class="r-title">Taille</div></div><div class="r-right"><div class="r-sub">1,77 m</div><div class="chevron">›</div></div></div>
      </div>
    `;
  }

  /* --- RENDU : REGLAGES --- */
  function renderReglages(){
    $('#v-reglages').innerHTML = `
      <div class="head"><h1>Réglages</h1><div class="line"></div></div>
      <div class="card">
        <div class="row" data-act="tab" data-tab="coach"><div class="r-left"><div class="r-title">Coach IA</div></div><div class="chevron">›</div></div>
      </div>
    `;
  }

  /* --- RENDU : SEANCE (Pull A) --- */
  function renderSeance(){
    var el = $('#v-seance');
    if(!state.currentSession) return;

    var exHtml = state.currentSession.exercises.map(function(ex, i){
      // Calcul résumé : 2 séries • 8-10 reps • 14kg
      var setsCount = ex.sets.length;
      var minReps = Math.min(...ex.sets.map(s=>s.reps||0));
      var maxReps = Math.max(...ex.sets.map(s=>s.reps||0));
      var maxKg = Math.max(...ex.sets.map(s=>s.kg||0));
      var rangeReps = minReps === maxReps ? `${maxReps}` : `${minReps}-${maxReps}`;
      
      return `
        <div class="ex-row" data-act="open-exo" data-index="${i}">
          <div class="ex-illu">🏋️</div>
          <div class="ex-info">
            <div class="ex-title">${esc(ex.name)}</div>
            <div class="ex-sub">${setsCount} séries • ${rangeReps} répétitions • ${maxKg > 0 ? maxKg.toFixed(2)+' kg' : 'Poids du corps'}</div>
          </div>
          <div class="chevron">›</div>
        </div>
      `;
    }).join('');

    el.innerHTML = `
      <div class="session-header">
        <button class="icon-btn" data-act="tab" data-tab="entrainements"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div style="display:flex; gap:8px">
          <button class="icon-btn">⌨️</button>
          <button class="icon-btn">👤</button>
          <button class="icon-btn">⏱️</button>
        </div>
      </div>
      <h1 class="head" style="font-size:36px; margin-bottom:20px;">${esc(state.currentSession.title)}<br><span style="display:inline-block; width:40px; height:4px; background:var(--accent); border-radius:2px; margin-top:10px;"></span></h1>
      
      <div class="card">
        ${exHtml}
      </div>
    `;
  }

  /* --- RENDU : EXO DETAIL (Curl Pupitre) --- */
  function renderExoDetail(){
    var el = $('#v-exo-detail');
    if(!state.currentExo) return;
    
    var ex = state.currentExo;
    // Récupérer l'historique de cet exo dans les séances passées
    var pastSessions = state.sessions.filter(s => s.exercises.some(e => e.name === ex.name)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);

    var setsHtml = ex.sets.map(function(s, j){
      // Chercher les 3 dernières perfs pour cette série précise
      var historyLines = pastSessions.map(ps => {
        var pex = ps.exercises.find(e => e.name === ex.name);
        var pset = pex.sets[j];
        if(!pset) return '';
        return `<div><u>${fmtShort(ps.date)}</u> ${pset.reps}×${Number(pset.kg).toFixed(2)}kg</div>`;
      }).join('');

      return `
        <div class="set-history-row">
          <div class="set-circle">${j+1}</div>
          <div class="set-main" style="width:120px">
            ${s.reps||0}-${s.reps||0} × ${Number(s.kg||0).toFixed(2)}<span>kg</span>
          </div>
          <div class="set-history-text">${historyLines || '<span style="font-size:12px">Aucun historique</span>'}</div>
        </div>
      `;
    }).join('');

    // Graphique factice (on génère un SVG simple basé sur le maxKg)
    var maxWeight = Math.max(...ex.sets.map(s=>s.kg||0));
    var svgHtml = `
      <div class="chart-container">
        <div style="display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:12px">
          <span>12 ×</span>
          <span>${maxWeight.toFixed(2)} kg</span>
        </div>
        <svg class="chart-svg" viewBox="0 0 300 100">
          <path d="M0 80 Q 50 70, 100 80 T 200 40 T 300 40" fill="none" stroke="var(--accent)" stroke-width="3"/>
          <circle cx="200" cy="40" r="4" fill="var(--accent)"/>
          <circle cx="300" cy="40" r="4" fill="var(--accent)"/>
        </svg>
      </div>
    `;

    el.innerHTML = `
      <div class="exo-detail-header">
        <button class="icon-btn" data-act="back-to-session"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div style="display:flex; gap:8px">
          <button class="icon-btn">⌨️</button>
          <button class="icon-btn">👤</button>
          <button class="icon-btn" data-act="timer-show">⏱️</button>
        </div>
      </div>
      
      <div class="exo-detail-title">${esc(ex.name)}</div>
      
      <div class="card" style="padding:16px;">
        ${setsHtml}
      </div>
      
      ${svgHtml}
    `;
    $('#timer-bar').hidden = false;
  }

  /* --- RENDU : COACH --- */
  function renderCoach(){
    var el = $('#v-coach');
    var msgs = state.chat.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join('');
    el.innerHTML = `
      <div class="head" style="display:flex; justify-content:space-between; align-items:center">
        <button class="btn ghost" data-act="tab" data-tab="reglages" style="padding:0">‹ Retour</button>
        <h1 style="margin:0; font-size:20px">Coach IA</h1><div style="width:60px"></div>
      </div>
      <div class="chat-container" id="chatlist">${msgs || '<div class="msg bot">Bonjour ! Posez-moi une question.</div>'}</div>
      <div style="display:flex; gap:8px; margin-top:12px">
        <input type="text" id="chat-in" placeholder="Votre question..." style="flex:1">
        <button class="btn primary" data-act="send-chat">Envoyer</button>
      </div>
    `;
    var list = $('#chatlist'); if(list) list.scrollTop = list.scrollHeight;
  }

  function renderAll(){
    ['entrainements','exercices','historique','mensurations','reglages','seance','exo-detail','coach'].forEach(function(t){$('#v-'+t).hidden=state.tab!==t});
    document.querySelectorAll('nav button').forEach(function(b){
      if(b.dataset.tab===state.tab) b.classList.add('active'); else b.classList.remove('active');
    });

    if(state.tab === 'entrainements') renderEntrainements();
    else if(state.tab === 'exercices') renderExercices();
    else if(state.tab === 'historique') renderHistorique();
    else if(state.tab === 'mensurations') renderMensurations();
    else if(state.tab === 'reglages') renderReglages();
    else if(state.tab === 'seance') renderSeance();
    else if(state.tab === 'exo-detail') renderExoDetail();
    else if(state.tab === 'coach') renderCoach();
  }

  /* --- TIMER --- */
  function updateTimerDisplay() {
    var h = Math.floor(timerSec / 3600);
    var m = Math.floor((timerSec % 3600) / 60);
    var s = timerSec % 60;
    $('#timer-display').textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  function toggleTimer() {
    if(timerRunning) {
      clearInterval(timerInt);
      $('#timer-btn').textContent = 'Start';
    } else {
      timerInt = setInterval(() => { timerSec++; updateTimerDisplay(); }, 1000);
      $('#timer-btn').textContent = 'Stop';
    }
    timerRunning = !timerRunning;
  }

  /* --- ACTIONS --- */
  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-act]');
    if(!t) return;
    var act = t.dataset.act;

    if(act === 'tab'){
      state.tab = t.dataset.tab;
      renderAll();
      window.scrollTo(0,0);
    }
    else if(act === 'start-tpl'){
      var tpl = state.templates.find(x => x.id === t.dataset.id);
      if(!tpl) return;
      
      var ns = { id: uid8(), date: todayStr(), title: tpl.title, exercises: [] };
      tpl.exercises.forEach(function(exName){
        // Pré-remplir avec l'historique
        var h = state.sessions.flatMap(s => s.exercises).filter(e => e.name === exName)[0];
        var sets = [{reps: h?.sets[0]?.reps || 10, kg: h?.sets[0]?.kg || 0}, {reps: h?.sets[1]?.reps || 10, kg: h?.sets[1]?.kg || 0}];
        ns.exercises.push({name: exName, sets: sets});
      });
      state.currentSession = ns;
      state.tab = 'seance';
      renderAll();
    }
    else if(act === 'open-exo'){
      var idx = parseInt(t.dataset.index);
      state.currentExo = state.currentSession.exercises[idx];
      state.tab = 'exo-detail';
      renderAll();
    }
    else if(act === 'back-to-session'){
      state.currentExo = null;
      $('#timer-bar').hidden = true; // cacher le timer
      state.tab = 'seance';
      renderAll();
    }
    else if(act === 'cal-prev'){ calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; } renderHistorique(); }
    else if(act === 'cal-next'){ calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; } renderHistorique(); }
    else if(act === 'timer-show'){ $('#timer-bar').hidden = false; }
    else if(act === 'timer-toggle'){ toggleTimer(); }
    else if(act === 'timer-reset'){ clearInterval(timerInt); timerRunning = false; timerSec = 0; updateTimerDisplay(); $('#timer-btn').textContent = 'Start'; }
    else if(act === 'send-chat'){
      var inp = $('#chat-in');
      if(!inp || !inp.value.trim()) return;
      var q = inp.value.trim();
      inp.value = '';
      state.chat.push({ role: 'user', text: q });
      renderCoach();
      
      var samplePromise = getSample();
      samplePromise.then(sample => {
        return sample("Contexte muscu. Question: " + q, {
          onText: function(res) {
            var msgs = document.querySelectorAll('.msg.bot');
            var lastBot = msgs[msgs.length - 1];
            if(!lastBot || lastBot.textContent === 'En cours...') {
               var div = document.createElement('div');
               div.className = 'msg bot';
               div.textContent = res.text;
               $('#chatlist').appendChild(div);
            } else {
               lastBot.textContent = res.text;
            }
          }
        });
      }).then(res => {
        state.chat.push({ role: 'bot', text: res.text });
      }).catch(err => {
        alert("Erreur coach : " + err.message);
      });
    }
    // SAUVEGARDER LA SÉANCE (bouton Terminer)
    else if(act === 'finish-session'){
      state.sessions.push(JSON.parse(JSON.stringify(state.currentSession)));
      saveSessions();
      state.currentSession = null;
      state.currentExo = null;
      $('#timer-bar').hidden = true;
      state.tab = 'entrainements';
      renderAll();
    }
  });

  initStore();
})();
</script>
</body></html>
