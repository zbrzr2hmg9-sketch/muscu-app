<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Entraînements</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --fg:#1C1C1E; --muted:#8E8E93; --rule:#E5E5EA;
  --accent:#20B2AA; --accent-fg:#FFFFFF; --accent-light:#E0F7F6;
  --danger:#FF3B30; --blue:#007AFF;
  --display:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --fg:#FFFFFF; --muted:#8E8E93; --rule:#38383A;
    --accent:#2AC9C0; --accent-light:#1A2E2E;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.4; padding-block:16px 96px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:600px; margin:0 auto}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1{font-family:var(--display); font-weight:800; font-size:32px; margin:0 0 4px 0; letter-spacing:-0.5px}
h2{font-family:var(--display); font-weight:700; font-size:22px; margin:0 0 12px 0}
h3{font-family:var(--display); font-weight:600; font-size:17px; margin:0}
.head{margin-bottom:20px; padding-top:8px}
.head .sub{font-size:15px; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:6px}
.head .line{display:inline-block; width:40px; height:4px; background:var(--accent); border-radius:2px; margin-top:6px}
.card{background:var(--surface); border-radius:16px; overflow:hidden; margin-bottom:16px}
.row{display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--rule); gap:12px}
.row:last-child{border-bottom:0}
.row .r-left{display:flex; flex-direction:column; gap:2px; flex:1; min-width:0}
.row .r-title{font-weight:600; font-size:17px; color:var(--fg)}
.row .r-sub{font-size:13px; color:var(--muted); font-weight:500}
.row .r-right{display:flex; align-items:center; gap:12px; flex-shrink:0}
.badge-jours{background:#E8E8ED; color:#555; font-size:13px; font-weight:600; padding:4px 10px; border-radius:12px; display:flex; align-items:center; gap:4px}
.badge-jours .check{color:var(--accent); font-size:12px}
.info-btn{background:transparent; border:2px solid var(--accent); color:var(--accent); width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; cursor:pointer}
.chevron{color:#C7C7CC; font-size:20px; font-weight:400}
.icon-btn{background:var(--bg); border:0; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--fg)}
.btn{min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--rule); background:var(--surface); font-weight:600; font-size:15px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent; border-color:transparent; color:var(--accent)}
input[type="text"], input[type="number"], input[type="date"], textarea{width:100%; border:1px solid var(--rule); border-radius:10px; background:var(--bg); padding:12px; font-size:16px; color:var(--fg); outline:none}
input:focus, textarea:focus{border-color:var(--accent)}
.lbl{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px}
nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--rule); z-index:20; padding-bottom:env(safe-area-inset-bottom, 0px); display:flex; justify-content:space-around; height:64px; padding-top:8px}
nav button{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--muted); font-size:10px; font-weight:600; padding:0 8px; flex:1}
nav button svg{width:24px; height:24px; fill:currentColor}
nav button.active{color:var(--accent)}
/* Séance active */
.ex-card{background:var(--surface); border-radius:12px; padding:14px; margin-bottom:12px}
.set-row{display:grid; grid-template-columns:30px 1fr 1fr 1fr 36px; gap:8px; align-items:center; margin-bottom:6px}
.set-row .idx{font-weight:700; color:var(--muted); text-align:center}
.set-row input{height:44px; text-align:center; font-size:18px; font-weight:700; border-radius:8px; border:1px solid var(--rule); background:var(--bg)}
/* Historique Calendrier */
.cal{background:var(--surface); border-radius:16px; padding:16px; margin-bottom:16px}
.cal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
.cal-head button{background:none; border:0; color:var(--muted); font-size:20px; padding:8px}
.cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); text-align:center; gap:8px 0}
.cal-day-name{font-size:12px; font-weight:600; color:var(--muted); padding-bottom:8px}
.cal-day{position:relative; padding:8px 0; font-size:15px; font-weight:500; cursor:pointer; border-radius:50%}
.cal-day.has-workout{color:var(--accent); font-weight:700}
.cal-day.has-workout::after{content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:6px; height:6px; border-radius:50%; background:var(--accent)}
.cal-day.selected{background:var(--accent-light)}
/* Mensurations */
.m-row{display:flex; justify-content:space-between; padding:16px; border-bottom:1px solid var(--rule); font-size:16px}
.m-row:last-child{border-bottom:0}
.m-val{font-weight:600; color:var(--muted)}
/* Coach Chat */
.chat-container{display:flex; flex-direction:column; gap:12px; margin-bottom:16px}
.msg{max-width:85%; padding:12px 16px; border-radius:20px; font-size:15px; line-height:1.4}
.msg.user{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start; background:var(--surface); border:1px solid var(--rule); border-bottom-left-radius:4px}
</style>

<div class="wrap">
  <main>
    <section id="v-entrainements" aria-label="Entraînements"></section>
    <section id="v-exercices" aria-label="Exercices" hidden></section>
    <section id="v-historique" aria-label="Historique" hidden></section>
    <section id="v-mensurations" aria-label="Mensurations" hidden></section>
    <section id="v-reglages" aria-label="Réglages" hidden></section>
    <section id="v-seance" aria-label="Séance en cours" hidden></section>
    <section id="v-coach" aria-label="Coach IA" hidden></section>
  </main>
</div>
<nav aria-label="Navigation">

    Exercices
  </button>
  <button type="button" data-act="tab" data-tab="historique">

    Mensurations
  </button>
  <button type="button" data-act="tab" data-tab="reglages">
    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
    Réglages
  </button>
</nav>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var LS_KEY='carnet-muscu.v1';
  var state={tab:'entrainements',sessions:[],cur:null,templates:[],metrics:[],loaded:false,saveState:'idle'};
  var currentDate = new Date();
  var calMonth = currentDate.getMonth();
  var calYear = currentDate.getFullYear();
  var chatAbort=null;

  function uid8(){return Math.random().toString(36).slice(2,10)}
  function pad(n){return String(n).padStart(2,'0')}
  function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function parseDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
  function fmtShort(s){return parseDate(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
  function num(n,d){return Number(n).toLocaleString('fr-FR',{maximumFractionDigits:d==null?1:d})}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}

  function initStore(){
    try{state.sessions=JSON.parse(localStorage.getItem(LS_KEY)||'[]')}catch(e){state.sessions=[]}
    try{state.templates=JSON.parse(lsGet('carnet-muscu.templates','[]'))}catch(e){state.templates=[]}
    try{state.metrics=JSON.parse(lsGet('carnet-muscu.metrics','[]'))}catch(e){state.metrics=[]}
    // Templates par défaut si vide
    if(!state.templates.length){
      state.templates = [
        {id:'t1', title:'Pull A', desc:'Pectoraux Dos Bras', exercises:['Tractions','Rowing barre','Curl biceps']},
        {id:'t2', title:'Push A', desc:'Épaules Pectoraux Bras', exercises:['Développé couché','Développé militaire','Dips']},
        {id:'t3', title:'Legs', desc:'Dos Jambes', exercises:['Squat','Soulevé de terre','Presse à cuisses']},
        {id:'t4', title:'Pull B', desc:'Épaules Dos Bras', exercises:['Tirage vertical','Rowing haltère','Curl marteau']},
        {id:'t5', title:'Push B', desc:'Épaules Pectoraux Bras', exercises:['Développé incliné','Élévations latérales','Barre au front']}
      ];
      saveTemplates();
    }
    state.loaded=true;
    renderAll();
  }
  function saveSessions(){try{localStorage.setItem(LS_KEY,JSON.stringify(state.sessions))}catch(e){}}
  function saveTemplates(){try{localStorage.setItem('carnet-muscu.templates',JSON.stringify(state.templates))}catch(e){}}
  function saveMetrics(){try{localStorage.setItem('carnet-muscu.metrics',JSON.stringify(state.metrics))}catch(e){}}

  async function getSample(){
    return async function(prompt, options){
      const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
      if (!res.ok) throw new Error('Erreur API');
      const reader = res.body.getReader(), decoder = new TextDecoder();
      let fullText = '', buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n'); buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) { fullText += delta; if (options?.onText) options.onText({ text: fullText }); }
          } catch (e) {}
        }
      }
      return { text: fullText };
    };
  }

  /* ---------- RENDU : ENTRAINEMENTS ---------- */
  function renderEntrainements(){
    var el = $('#v-entrainements');
    var today = new Date();
    var tplsHtml = state.templates.map(function(t){
      // Trouver la dernière fois que cette séance a été faite
      var lastDone = state.sessions.filter(s => s.title === t.title).sort((a,b)=>b.date.localeCompare(a.date))[0];
      var daysAgo = 'Nouveau';
      if(lastDone){
        var diff = Math.floor((today - parseDate(lastDone.date)) / (1000 * 60 * 60 * 24));
        daysAgo = diff === 0 ? "Auj." : diff + " j";
      }
      return `
        <div class="row" data-act="start-tpl" data-id="${t.id}">
          <div class="r-left">
            <div class="r-title">${esc(t.title)}</div>
            <div class="r-sub">${esc(t.desc)}</div>
          </div>
          <div class="r-right">
            <div class="badge-jours"><span class="check">✓</span> ${daysAgo}</div>
            <div class="info-btn">i</div>
            <div class="chevron">›</div>
          </div>
        </div>
      `;
    }).join('');

    el.innerHTML = `
      <div class="head">
        <h1>Entraînements</h1>
        <div class="line"></div>
      </div>
      <div class="card">
        ${tplsHtml}
      </div>
    `;
  }

  /* ---------- RENDU : EXERCICES ---------- */
  function renderExercices(){
    var el = $('#v-exercices');
    el.innerHTML = `
      <div class="head">
        <h1>Exercices</h1>
        <div class="sub">489 / 491 Exercices</div>
        <div class="line"></div>
      </div>
      <div style="background:var(--bg); border-radius:10px; padding:8px 12px; margin-bottom:16px; display:flex; align-items:center; gap:8px">
        <span style="color:var(--muted)">🔍</span>
        <input type="text" placeholder="Recherche" style="border:0; background:transparent; padding:0; font-size:16px">
      </div>
      <h2 style="font-size:20px">Épaules</h2>
      <div class="card" style="border-radius:12px; padding:16px; text-align:center; color:var(--muted)">
        La liste complète des exercices sera intégrée ici.
      </div>
    `;
  }

  /* ---------- RENDU : HISTORIQUE ---------- */
  function renderHistorique(){
    var el = $('#v-historique');
    var monthNames = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
    var firstDay = new Date(calYear, calMonth, 1).getDay();
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    var offset = (firstDay === 0 ? 6 : firstDay - 1); // Lundi = 0

    var daysHtml = '';
    for (var i = 0; i < offset; i++) daysHtml += '<div></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var dateStr = calYear + '-' + pad(calMonth+1) + '-' + pad(d);
      var hasWorkout = state.sessions.some(s => s.date === dateStr);
      daysHtml += `<div class="cal-day ${hasWorkout ? 'has-workout' : ''}">${d}</div>`;
    }

    el.innerHTML = `
      <div class="head">
        <h1>Historique</h1>
        <div class="line"></div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:flex-start">
          <div class="r-title">Entraînements</div>
          <div class="chevron">›</div>
        </div>
      </div>
      <div class="cal">
        <div class="cal-head">
          <button data-act="cal-prev">‹</button>
          <div style="font-weight:700; font-size:18px">${monthNames[calMonth]} ${calYear}</div>
          <button data-act="cal-next">›</button>
        </div>
        <div class="cal-grid">
          <div class="cal-day-name">L</div><div class="cal-day-name">M</div><div class="cal-day-name">M</div>
          <div class="cal-day-name">J</div><div class="cal-day-name">V</div><div class="cal-day-name">S</div><div class="cal-day-name">D</div>
          ${daysHtml}
        </div>
      </div>
    `;
  }

  /* ---------- RENDU : MENSURATIONS ---------- */
  function renderMensurations(){
    var el = $('#v-mensurations');
    // Récupérer la dernière valeur de chaque métrique
    function getLastVal(key, defaultVal) {
      var m = state.metrics.filter(x => x.key === key).sort((a,b)=>b.date.localeCompare(a.date))[0];
      return m ? m.value + ' ' + (m.unit||'') : defaultVal;
    }

    el.innerHTML = `
      <div class="head">
        <h1>Mensurations</h1>
        <div class="line"></div>
      </div>
      <h2 style="font-size:16px; text-transform:uppercase; color:var(--muted); letter-spacing:0.5px; margin-bottom:8px; margin-left:8px">Informations de base</h2>
      <div class="card">
        <div class="row" data-act="add-metric" data-key="Poids" data-unit="kg" data-default="83,70">
          <div class="r-left"><div class="r-title">Poids</div></div>
          <div class="r-right"><div class="m-val">${getLastVal('Poids', '83,70 kg')}</div><div class="chevron">›</div></div>
        </div>
        <div class="row">
          <div class="r-left"><div class="r-title">Taille</div></div>
          <div class="r-right"><div class="m-val">1,77 m</div><div class="chevron">›</div></div>
        </div>
        <div class="row" data-act="add-metric" data-key="Masse grasse" data-unit="%" data-default="17,11">
          <div class="r-left"><div class="r-title">Indice de masse grasse</div></div>
          <div class="r-right"><div class="m-val">${getLastVal('Masse grasse', '17,11 %')}</div><div class="chevron">›</div></div>
        </div>
        <div class="row">
          <div class="r-left"><div class="r-title">Eau corporelle</div></div>
          <div class="r-right"><div class="m-val">-</div><div class="chevron">›</div></div>
        </div>
        <div class="row">
          <div class="r-left"><div class="r-title">Masse musculaire</div></div>
          <div class="r-right"><div class="m-val">-</div><div class="chevron">›</div></div>
        </div>
      </div>

      <h2 style="font-size:16px; text-transform:uppercase; color:var(--muted); letter-spacing:0.5px; margin:20px 0 8px 8px">Circonférences</h2>
      <div class="card">
        <div class="row" data-act="add-metric" data-key="Cou" data-unit="cm" data-default="38">
          <div class="r-left"><div class="r-title">Cou</div></div>
          <div class="r-right"><div class="m-val">${getLastVal('Cou', '38,50 cm')}</div><div class="chevron">›</div></div>
        </div>
        <div class="row" data-act="add-metric" data-key="Biceps" data-unit="cm" data-default="36.5">
          <div class="r-left"><div class="r-title">Bras (Biceps)</div></div>
          <div class="r-right"><div class="m-val">${getLastVal('Biceps', '36,50 cm')}</div><div class="chevron">›</div></div>
        </div>
        <div class="row" data-act="add-metric" data-key="Épaules" data-unit="cm" data-default="120">
          <div class="r-left"><div class="r-title">Épaules</div></div>
          <div class="r-right"><div class="m-val">${getLastVal('Épaules', '120 cm')}</div><div class="chevron">›</div></div>
        </div>
      </div>
    `;
  }

  /* ---------- RENDU : REGLAGES ---------- */
  function renderReglages(){
    var el = $('#v-reglages');
    el.innerHTML = `
      <div class="head">
        <h1>Réglages</h1>
        <div class="line"></div>
      </div>
      <div class="card">
        <div class="row" data-act="tab" data-tab="coach" style="cursor:pointer">
          <div class="r-left"><div class="r-title">Coach IA</div><div class="r-sub">Discuter avec DeepSeek</div></div>
          <div class="chevron">›</div>
        </div>
        <div class="row">
          <div class="r-left"><div class="r-title">Thème sombre</div></div>
          <div class="r-right">
            <select id="theme-sel" style="width:auto; padding:6px; border-radius:6px; border:1px solid var(--rule); background:var(--surface)">
              <option value="light">Clair</option>
              <option value="dark">Sombre</option>
              <option value="auto" selected>Auto</option>
            </select>
          </div>
        </div>
      </div>
    `;
  }

  /* ---------- RENDU : SEANCE EN COURS ---------- */
  function renderSeance(){
    var el = $('#v-seance');
    if(!state.cur){
      el.innerHTML = `<button class="btn ghost" data-act="tab" data-tab="entrainements" style="margin-bottom:16px">‹ Retour</button><p>Séance introuvable.</p>`;
      return;
    }
    var exHtml = state.cur.exercises.map(function(ex, i){
      var setsHtml = ex.sets.map(function(s, j){
        return `
          <div class="set-row">
            <div class="idx">${j+1}</div>
            <input type="text" inputmode="numeric" value="${s.reps||''}" data-field="reps" data-ex="${i}" data-set="${j}" placeholder="Reps">
            <input type="text" inputmode="decimal" value="${s.kg||''}" data-field="kg" data-ex="${i}" data-set="${j}" placeholder="Kg">
            <input type="text" inputmode="text" value="${s.n||''}" data-field="n" data-ex="${i}" data-set="${j}" placeholder="RIR">
            <button class="icon-btn" data-act="del-set" data-ex="${i}" data-set="${j}">×</button>
          </div>
        `;
      }).join('');

      return `
        <div class="ex-card">
          <div style="display:flex; justify-content:space-between; margin-bottom:10px">
            <h3>${esc(ex.name)}</h3>
            <button class="btn ghost" style="padding:0; font-size:14px; min-height:auto" data-act="add-set" data-ex="${i}">+ Série</button>
          </div>
          ${setsHtml}
        </div>
      `;
    }).join('');

    el.innerHTML = `
      <div class="head" style="display:flex; justify-content:space-between; align-items:center">
        <button class="btn ghost" data-act="tab" data-tab="entrainements" style="padding:0">Annuler</button>
        <h1 style="margin:0; font-size:24px">${esc(state.cur.title)}</h1>
        <button class="btn primary" data-act="finish-session" style="padding:8px 12px; min-height:36px">Terminer</button>
      </div>
      <div style="margin-bottom:16px; text-align:center">
        <p class="sub">Séance du ${fmtShort(state.cur.date)}</p>
      </div>
      ${exHtml}
    `;
  }

  /* ---------- RENDU : COACH ---------- */
  function renderCoach(){
    var el = $('#v-coach');
    var c = state.cur;
    if(!c.chat) c.chat = [];
    var msgs = c.chat.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join('');
    
    el.innerHTML = `
      <div class="head" style="display:flex; justify-content:space-between; align-items:center">
        <button class="btn ghost" data-act="tab" data-tab="reglages" style="padding:0">‹ Retour</button>
        <h1 style="margin:0; font-size:20px">Coach IA</h1>
        <div style="width:60px"></div>
      </div>
      <div class="chat-container" id="chatlist">
        ${msgs || '<div class="msg bot">Bonjour ! Posez-moi une question sur votre séance ou votre progression.</div>'}
      </div>
      <div style="display:flex; gap:8px; margin-top:12px">
        <input type="text" id="chat-in" placeholder="Votre question..." style="flex:1">
        <button class="btn primary" data-act="send-chat">Envoyer</button>
      </div>
    `;
    var list = $('#chatlist');
    if(list) list.scrollTop = list.scrollHeight;
  }

  /* ---------- ACTIONS ---------- */
  function renderAll(){
    ['entrainements','exercices','historique','mensurations','reglages','seance','coach'].forEach(function(t){$('#v-'+t).hidden=state.tab!==t});
    document.querySelectorAll('nav button').forEach(function(b){
      if(b.dataset.tab===state.tab) b.classList.add('active'); else b.classList.remove('active');
    });

    if(state.tab === 'entrainements') renderEntrainements();
    else if(state.tab === 'exercices') renderExercices();
    else if(state.tab === 'historique') renderHistorique();
    else if(state.tab === 'mensurations') renderMensurations();
    else if(state.tab === 'reglages') renderReglages();
    else if(state.tab === 'seance') renderSeance();
    else if(state.tab === 'coach') renderCoach();
  }

  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-act]');
    if(!t) return;
    var act = t.dataset.act;

    if(act === 'tab'){
      state.tab = t.dataset.tab;
      renderAll();
      window.scrollTo(0,0);
    }
    else if(act === 'start-tpl'){
      var tpl = state.templates.find(x => x.id === t.dataset.id);
      if(!tpl) return;
      var ns = { id: uid8(), date: todayStr(), title: tpl.title, exercises: [], updatedAt: Date.now() };
      tpl.exercises.forEach(function(exName){
        var h = state.sessions.flatMap(s => s.exercises).filter(e => e.name === exName).sort((a,b)=>b.date?.localeCompare(a.date||''))[0];
        var sets = [];
        for(var i=0; i<3; i++) sets.push({reps: h ? (h.sets[i]?.reps || 10) : 10, kg: h ? (h.sets[i]?.kg || 0) : 0});
        ns.exercises.push({name: exName, sets: sets});
      });
      state.cur = ns;
      state.tab = 'seance';
      renderAll();
    }
    else if(act === 'add-set'){
      var i = parseInt(t.dataset.ex);
      state.cur.exercises[i].sets.push({reps: null, kg: null, n: null});
      renderSeance();
    }
    else if(act === 'del-set'){
      var i = parseInt(t.dataset.ex), j = parseInt(t.dataset.set);
      state.cur.exercises[i].sets.splice(j, 1);
      renderSeance();
    }
    else if(act === 'finish-session'){
      // Sauvegarder la séance
      state.sessions.push(JSON.parse(JSON.stringify(state.cur)));
      saveSessions();
      state.cur = null;
      state.tab = 'entrainements';
      renderAll();
    }
    else if(act === 'cal-prev'){
      calMonth--;
      if(calMonth < 0){ calMonth = 11; calYear--; }
      renderHistorique();
    }
    else if(act === 'cal-next'){
      calMonth++;
      if(calMonth > 11){ calMonth = 0; calYear++; }
      renderHistorique();
    }
    else if(act === 'add-metric'){
      var key = t.dataset.key;
      var val = prompt('Entrez la nouvelle valeur pour : ' + key);
      if(val) {
        state.metrics.push({ key: key, value: val, unit: t.dataset.unit, date: todayStr() });
        saveMetrics();
        renderMensurations();
      }
    }
    else if(act === 'send-chat'){
      var inp = $('#chat-in');
      if(!inp || !inp.value.trim()) return;
      var q = inp.value.trim();
      inp.value = '';
      if(!state.cur) state.cur = { chat: [] };
      if(!state.cur.chat) state.cur.chat = [];
      state.cur.chat.push({ role: 'user', text: q });
      renderCoach();
      
      var samplePromise = getSample();
      samplePromise.then(sample => {
        return sample("Contexte muscu. Question: " + q, {
          onText: function(res) {
            // Remplacer le dernier message bot ou en créer un
            var msgs = document.querySelectorAll('.msg.bot');
            var lastBot = msgs[msgs.length - 1];
            if(!lastBot || lastBot.textContent === 'En cours...') {
               var div = document.createElement('div');
               div.className = 'msg bot';
               div.textContent = res.text;
               $('#chatlist').appendChild(div);
            } else {
               lastBot.textContent = res.text;
            }
          }
        });
      }).then(res => {
        state.cur.chat.push({ role: 'bot', text: res.text });
        // Note: on ne sauvegarde pas le chat dans les sessions pour ne pas polluer l'historique
      }).catch(err => {
        alert("Erreur coach : " + err.message);
      });
    }
  });

  document.addEventListener('input', function(ev){
    var t = ev.target;
    if(t.dataset && t.dataset.field && state.cur){
      var i = parseInt(t.dataset.ex);
      var j = parseInt(t.dataset.set);
      var s = state.cur.exercises[i].sets[j];
      if(t.dataset.field === 'reps') s.reps = parseInt(t.value) || null;
      if(t.dataset.field === 'kg') s.kg = parseFloat(t.value.replace(',','.')) || null;
      if(t.dataset.field === 'n') s.n = t.value;
    }
  });

  document.addEventListener('change', function(ev){
    var t = ev.target;
    if(t.id === 'theme-sel'){
      if(t.value === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t.value);
    }
  });

  // Lancer
  initStore();
})();
</script>
</body></html>
